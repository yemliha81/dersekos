<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KPSS Tarih — 300 Soruluk Kapsamlı Quiz</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Vazirmatn:wght@400;500;600;700;800&display=swap');

  :root{
    --parchment:#EDE2C6;
    --parchment-deep:#E4D5AE;
    --ink:#2b2018;
    --ink-soft:#5a4a37;
    --maroon:#7A1F2B;
    --maroon-deep:#5A1520;
    --gold:#A8792F;
    --gold-bright:#C79A43;
    --green:#3E5C3A;
    --card:#F7F0DC;
    --shadow: rgba(43,32,24,0.25);
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0;
    background:
      radial-gradient(circle at 15% 10%, rgba(168,121,47,0.10), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(122,31,43,0.10), transparent 45%),
      var(--parchment);
    color:var(--ink);
    font-family:'Vazirmatn', sans-serif;
    min-height:100vh;
  }

  .app{
    max-width:820px;
    margin:0 auto;
    padding:28px 18px 60px;
  }

  /* ---- Header / Tughra-ish mark ---- */
  header.top{
    text-align:center;
    margin-bottom:22px;
    position:relative;
  }
  .mark{
    width:64px; height:64px;
    margin:0 auto 8px;
    display:block;
  }
  h1.title{
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-style:italic;
    font-size:2.5rem;
    color:var(--maroon-deep);
    margin:0 0 2px;
    letter-spacing:0.3px;
  }
  .subtitle{
    font-size:0.92rem;
    color:var(--ink-soft);
    letter-spacing:0.5px;
  }
  .rule{
    height:2px;
    margin:14px auto 0;
    max-width:360px;
    background:linear-gradient(90deg, transparent, var(--gold) 20%, var(--maroon) 50%, var(--gold) 80%, transparent);
    opacity:0.7;
  }

  /* ---- Progress ---- */
  .progress-wrap{
    margin:20px 0 8px;
  }
  .progress-row{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:0.85rem; color:var(--ink-soft); margin-bottom:6px;
  }
  .progress-row .score{
    color:var(--maroon-deep); font-weight:700;
  }
  .progress-bar{
    height:8px; border-radius:6px;
    background:rgba(90,74,55,0.15);
    overflow:hidden;
    border:1px solid rgba(90,74,55,0.25);
  }
  .progress-fill{
    height:100%;
    background:linear-gradient(90deg, var(--gold) 0%, var(--maroon) 100%);
    width:0%;
    transition:width .35s ease;
  }
  .era-badge{
    display:inline-block;
    font-size:0.72rem;
    font-weight:700;
    letter-spacing:0.6px;
    color:var(--maroon-deep);
    background:rgba(122,31,43,0.09);
    border:1px solid rgba(122,31,43,0.28);
    border-radius:999px;
    padding:4px 12px;
    margin-bottom:14px;
  }

  /* ---- Card ---- */
  .card{
    background:var(--card);
    border:1px solid rgba(90,74,55,0.25);
    border-radius:14px;
    padding:26px 24px 22px;
    box-shadow:0 10px 24px var(--shadow), 0 1px 0 rgba(255,255,255,0.5) inset;
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute; inset:0;
    border-radius:14px;
    padding:1px;
    background:linear-gradient(135deg, var(--gold-bright), transparent 30%, transparent 70%, var(--maroon));
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
            mask-composite: exclude;
    pointer-events:none;
    opacity:0.55;
  }

  .qnum{
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    color:var(--gold);
    font-size:0.95rem;
    margin-bottom:6px;
    letter-spacing:0.5px;
  }
  .qtext{
    font-size:1.18rem;
    line-height:1.55;
    font-weight:600;
    color:var(--ink);
    margin:0 0 20px;
  }

  .options{
    display:flex; flex-direction:column; gap:11px;
  }
  .opt{
    text-align:right;
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 16px;
    background:rgba(255,255,255,0.35);
    border:1.5px solid rgba(90,74,55,0.3);
    border-radius:10px;
    cursor:pointer;
    font-size:1rem;
    color:var(--ink);
    transition: all .15s ease;
    font-family:inherit;
  }
  .opt:hover:not(.locked){
    border-color:var(--gold);
    background:rgba(199,154,67,0.15);
    transform:translateY(-1px);
  }
  .opt .letter{
    flex:0 0 26px;
    height:26px;
    border-radius:50%;
    border:1.5px solid var(--ink-soft);
    display:flex; align-items:center; justify-content:center;
    font-size:0.82rem; font-weight:700;
    color:var(--ink-soft);
  }
  .opt .txt{ flex:1; }

  .opt.correct{
    background:rgba(62,92,58,0.16);
    border-color:var(--green);
  }
  .opt.correct .letter{ background:var(--green); border-color:var(--green); color:#fff; }
  .opt.wrong{
    background:rgba(122,31,43,0.13);
    border-color:var(--maroon);
  }
  .opt.wrong .letter{ background:var(--maroon); border-color:var(--maroon); color:#fff; }
  .opt.locked{ cursor:default; }
  .opt.dim{ opacity:0.55; }

  .explain{
    margin-top:18px;
    padding:14px 16px;
    border-radius:10px;
    background:rgba(168,121,47,0.10);
    border:1px solid rgba(168,121,47,0.3);
    font-size:0.93rem;
    line-height:1.6;
    color:var(--ink-soft);
    display:none;
  }
  .explain.show{ display:block; animation: fade .25s ease; }
  .explain b{ color:var(--maroon-deep); }

  @keyframes fade{ from{opacity:0; transform:translateY(-4px);} to{opacity:1; transform:translateY(0);} }

  .nav-row{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:22px;
  }
  .btn{
    font-family:inherit;
    font-size:0.95rem;
    font-weight:700;
    padding:11px 22px;
    border-radius:9px;
    border:none;
    cursor:pointer;
    transition: all .15s ease;
  }
  .btn-primary{
    background:linear-gradient(135deg, var(--maroon), var(--maroon-deep));
    color:#F7EFD9;
    box-shadow:0 6px 14px rgba(122,31,43,0.35);
  }
  .btn-primary:hover{ transform:translateY(-1px); box-shadow:0 8px 18px rgba(122,31,43,0.45); }
  .btn-primary:disabled{ opacity:0.4; cursor:not-allowed; transform:none; box-shadow:none; }
  .btn-ghost{
    background:transparent;
    color:var(--ink-soft);
    border:1.5px solid rgba(90,74,55,0.35);
  }
  .btn-ghost:hover{ background:rgba(90,74,55,0.08); }

  /* ---- Result screen ---- */
  .result{
    text-align:center;
  }
  .result .big-score{
    font-family:'Cormorant Garamond', serif;
    font-weight:700;
    font-size:4rem;
    color:var(--maroon-deep);
    line-height:1;
    margin:8px 0 2px;
  }
  .result .big-score span{ font-size:2rem; color:var(--ink-soft); }
  .result .verdict{
    font-size:1.05rem;
    color:var(--ink-soft);
    margin-bottom:24px;
  }
  .breakdown{
    text-align:right;
    margin-top:18px;
    display:flex; flex-direction:column; gap:9px;
  }
  .breakdown-row{
    display:grid;
    grid-template-columns: 1fr auto 90px;
    align-items:center;
    gap:10px;
    font-size:0.85rem;
  }
  .breakdown-row .cat-name{ color:var(--ink-soft); }
  .breakdown-row .cat-score{ color:var(--ink); font-weight:700; font-variant-numeric: tabular-nums; }
  .mini-bar{
    height:6px; border-radius:4px; background:rgba(90,74,55,0.15); overflow:hidden;
  }
  .mini-fill{ height:100%; background:linear-gradient(90deg, var(--gold), var(--maroon)); }

  .result-actions{
    display:flex; gap:12px; justify-content:center; margin-top:26px; flex-wrap:wrap;
  }

  footer.foot{
    text-align:center;
    margin-top:34px;
    font-size:0.78rem;
    color:var(--ink-soft);
    opacity:0.75;
  }

  @media (max-width:600px){
    h1.title{ font-size:2rem; }
    .card{ padding:20px 16px 18px; }
    .qtext{ font-size:1.05rem; }
    .breakdown-row{ grid-template-columns: 1fr 60px; }
    .mini-bar{ display:none; }
  }

  /* focus visibility */
  .opt:focus-visible, .btn:focus-visible{
    outline:3px solid var(--gold-bright);
    outline-offset:2px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
  }
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <svg class="mark" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M32 6 C 20 6 12 16 12 28 C 12 40 20 48 22 52" stroke="#7A1F2B" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M32 6 C 44 6 52 16 52 28 C 52 40 44 48 42 52" stroke="#A8792F" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M22 52 C 22 56 26 58 32 58 C 38 58 42 56 42 52" stroke="#7A1F2B" stroke-width="2.4" stroke-linecap="round" fill="none"/>
      <circle cx="32" cy="9" r="3.4" fill="#A8792F"/>
      <path d="M32 12 L32 58" stroke="#7A1F2B" stroke-width="1.4" opacity="0.5"/>
    </svg>
    <h1 class="title">KPSS Tarih Sınavı</h1>
    <div class="subtitle">İslamiyet Öncesinden Günümüze — 300 Soruluk Kapsamlı Tekrar Testi</div>
    <div class="rule"></div>
  </header>

  <div id="quizArea"></div>

  <footer class="foot">Kaynak: KPSS Kapı Serisi Tarih Ders Notları özetinden hazırlanan özgün sorulardır.</footer>
</div>

<script>
const QUESTIONS = [{"cat": "İslamiyet Öncesi Türk Tarihi", "q": "Türk tarihi hakkındaki ilk bilgilere hangi kaynaklarda rastlanmaktadır?", "opts": ["Çin kaynakları", "Rus kaynakları", "Arap kaynakları", "Bizans kaynakları"], "a": 0, "exp": "Türk tarihi hakkındaki ilk bilgiler Çin kaynaklarında yer almaktadır."}, {"cat": "İslamiyet Öncesi Türk Tarihi", "q": "Ziya Gökalp'e göre 'Türk' adının anlamı aşağıdakilerden hangisidir?", "opts": ["Güç, kuvvet", "Olgunluk çağı", "Töreli, kanun ve nizam sahibi", "Miğfer"], "a": 2, "exp": "Ziya Gökalp'e göre Türk adı 'töreli, kanun ve nizam sahibi' anlamına gelmektedir."}, {"cat": "İslamiyet Öncesi Türk Tarihi", "q": "Türk adının geçtiği ilk yazılı milli kaynak aşağıdakilerden hangisidir?", "opts": ["Orhon/Göktürk Kitabeleri", "Kutadgu Bilig", "Divan-ı Lügati't Türk", "Dede Korkut Hikayeleri"], "a": 0, "exp": "Türk adının geçtiği ilk yazılı milli kaynak Orhon/Göktürk Kitabeleri'dir."}, {"cat": "İslamiyet Öncesi Türk Tarihi", "q": "Devlet adı olarak 'Türk' sözcüğünü ilk kullanan devlet hangisidir?", "opts": ["Asya Hun Devleti", "Göktürkler", "Avarlar", "Kırgızlar"], "a": 1, "exp": "Devlet adı olarak Türk sözcüğünü ilk kullanan Göktürkler olmuştur."}, {"cat": "İslamiyet Öncesi Türk Tarihi", "q": "Aşağıdakilerden hangisi Türk göçlerinin nedenlerinden biri değildir?", "opts": ["İklim değişikliği ve kuraklık", "Nüfus artışı", "Salgın hayvan hastalıkları", "Denizcilik faaliyetlerinin gelişmesi"], "a": 3, "exp": "Denizcilik faaliyetlerinin gelişmesi Türk göçlerinin nedenleri arasında yer almaz; iklim, kuraklık, nüfus artışı ve salgın hastalıklar göç nedenlerindendir."}, {"cat": "İslamiyet Öncesi Türk Tarihi", "q": "Göçebe Türk yaşantısının sonuçlarından biri olarak aşağıdakilerden hangisi söylenemez?", "opts": ["Mimari gelişmemiştir", "Sanat eserleri taşınabilir niteliktedir", "Sınıf ayrımı görülmez", "Özel mülkiyet yaygındır"], "a": 3, "exp": "Göçebe yaşantının bir sonucu olarak özel mülkiyet görülmez; bu nedenle 'özel mülkiyet yaygındır' ifadesi yanlıştır."}, {"cat": "İslamiyet Öncesi Türk Tarihi", "q": "Tarihte rol oynayan ilk Türk topluluğu aşağıdakilerden hangisidir?", "opts": ["Asya Hunları", "İskitler (Sakalar)", "Göktürkler", "Avarlar"], "a": 1, "exp": "İskitler (Sakalar), tarihte rol oynayan ilk Türk topluluğu olarak kabul edilir."}, {"cat": "İslamiyet Öncesi Türk Tarihi", "q": "Atı evcilleştiren ve atlı arabaları kullanan ilk kavim aşağıdakilerden hangisidir?", "opts": ["Avarlar", "İskitler", "Hunlar", "Kırgızlar"], "a": 1, "exp": "İskitler, atı evcilleştiren ve atlı arabaları kullanan ilk kavim olarak bilinir."}, {"cat": "İslamiyet Öncesi Türk Tarihi", "q": "İskit-İran (Pers) savaşlarını anlatan destan aşağıdakilerden hangisidir?", "opts": ["Oğuz Kağan Destanı", "Alper Tunga (Afrasyap) Destanı", "Ergenekon Destanı", "Göç Destanı"], "a": 1, "exp": "Alper Tunga (Afrasyap) Destanı, İskit-İran savaşlarını anlatan ve İskitlere ait bir destandır."}, {"cat": "İslamiyet Öncesi Türk Tarihi", "q": "İlk Türk kadın hükümdar olarak bilinen kişi kimdir?", "opts": ["Tomris", "Şad", "Yabgu", "Terken Hatun"], "a": 0, "exp": "Tomris, ilk Türk kadın hükümdar olarak kabul edilir ve İskit hükümdarlarındandır."}, {"cat": "İslamiyet Öncesi Türk Tarihi", "q": "Bilinen ilk Türk devleti ve merkezi aşağıdakilerden hangisidir?", "opts": ["Göktürk Devleti - Ötüken", "Asya Hun Devleti - Ötüken", "Uygur Devleti - Karabalgasun", "Avrupa Hun Devleti - Balamir"], "a": 1, "exp": "Bilinen ilk Türk devleti Asya (Büyük) Hun Devleti'dir ve merkezi Ötüken'dir."}, {"cat": "İslamiyet Öncesi Türk Tarihi", "q": "Asya Hun Devleti'nin bilinen ilk hükümdarı kimdir?", "opts": ["Mete Han", "Teoman", "Balamir", "Bumin Kağan"], "a": 1, "exp": "Asya Hun Devleti'nin bilinen ilk hükümdarı Teoman'dır."}, {"cat": "İslamiyet Öncesi Türk Tarihi", "q": "Çin, Hun istilasını durdurmak amacıyla aşağıdakilerden hangisini yapmıştır?", "opts": ["Çin Seddi'ni inşa etmiştir", "İpek Yolu'nu kapatmıştır", "Ordu-Millet sistemini kurmuştur", "Onluk sistemi geliştirmiştir"], "a": 0, "exp": "Çin, Hun istilasını durdurabilmek için Çin Seddi'ni yapmıştır."}, {"cat": "İslamiyet Öncesi Türk Tarihi", "q": "Orduyu onlu sisteme göre teşkilatlandıran ve MÖ 209'da tahta çıkan Hun hükümdarı kimdir?", "opts": ["Teoman", "Mete Han", "Balamir", "Attila"], "a": 1, "exp": "Mete Han (Oğuz Kağan), MÖ 209'da tahta çıkarak orduyu onluk sisteme göre teşkilatlandırmıştır."}, {"cat": "İslamiyet Öncesi Türk Tarihi", "q": "Türk Kara Kuvvetleri'nin kuruluş tarihi olarak kabul edilen yıl aşağıdakilerden hangisidir?", "opts": ["MÖ 209", "MÖ 220", "MS 216", "MS 375"], "a": 0, "exp": "Mete Han'ın tahta çıkışı olan MÖ 209, Türk Kara Kuvvetleri'nin kuruluş tarihi olarak kabul edilir."}, {"cat": "İslamiyet Öncesi Türk Tarihi", "q": "Asya Hun Devleti MS 58 yılında hangi iki kola ayrılmıştır?", "opts": ["Doğu ve Batı Hunları", "Güney ve Kuzey Hunları", "Avrupa ve Asya Hunları", "Ak Hunlar ve Kara Hunlar"], "a": 1, "exp": "Asya Hun Devleti, izlenen yanlış politikalar ve Çin baskısı sonucunda MS 58'de Güney ve Kuzey Hunları olarak ikiye ayrılmıştır."}, {"cat": "İslamiyet Öncesi Türk Tarihi", "q": "Kavimler Göçü'ne (375) doğrudan neden olan gelişme aşağıdakilerden hangisidir?", "opts": ["Çin baskısı altındaki Hunların Balamir liderliğinde batıya göç ederek Volga Nehri'ni geçmesi", "Roma İmparatorluğu'nun ikiye ayrılması", "Bizans'ın kurulması", "Attila'nın Roma'yı kuşatması"], "a": 0, "exp": "Çin baskısı altındaki Hunların Balamir liderliğinde batıya göç ederek Volga (İtil) Nehri'ni geçmesi Kavimler Göçü'ne neden olmuştur."}, {"cat": "İslamiyet Öncesi Türk Tarihi", "q": "Kavimler Göçü'nün sonuçlarından biri olarak aşağıdakilerden hangisi söylenebilir?", "opts": ["Roma İmparatorluğu parçalanmış ve Batı Roma yıkılmıştır", "İpek Yolu kapanmıştır", "İslamiyet doğmuştur", "Haçlı Seferleri başlamıştır"], "a": 0, "exp": "Kavimler Göçü sonucunda Roma İmparatorluğu parçalanmış (395), Batı Roma yıkılmış (476) ve Orta Çağ başlamıştır."}, {"cat": "İlk Türk-İslam Devletleri", "q": "Türklerin İslamiyet'i kabul etmesinde etkili olan ilk büyük savaş aşağıdakilerden hangisidir?", "opts": ["Talas Savaşı", "Malazgirt Savaşı", "Katvan Savaşı", "Dandanakan Savaşı"], "a": 0, "exp": "751 yılında yapılan Talas Savaşı, Türklerin kitleler halinde İslamiyet'i kabul etmesinde önemli bir dönüm noktasıdır."}, {"cat": "İlk Türk-İslam Devletleri", "q": "Talas Savaşı hangi devletler arasında yapılmıştır?", "opts": ["Türk-Arap birlikleri ile Çin", "Göktürkler ile Bizans", "Uygurlar ile Moğollar", "Karahanlılar ile Gazneliler"], "a": 0, "exp": "Talas Savaşı, Türk-Arap birleşik kuvvetleri ile Çin arasında yapılmış ve Arap-Türk ittifakı zafer kazanmıştır."}, {"cat": "İlk Türk-İslam Devletleri", "q": "İlk Müslüman Türk devleti aşağıdakilerden hangisidir?", "opts": ["Karahanlı Devleti", "Gazneli Devleti", "Büyük Selçuklu Devleti", "Tolunoğulları"], "a": 0, "exp": "Karahanlı Devleti, resmi olarak İslamiyet'i kabul eden ilk Türk-İslam devletidir."}, {"cat": "İlk Türk-İslam Devletleri", "q": "Karahanlı Devleti hangi hükümdar döneminde İslamiyet'i resmen kabul etmiştir?", "opts": ["Satuk Buğra Han", "Bilge Kül Kadir Han", "Yusuf Kadir Han", "Tuğrul Bey"], "a": 0, "exp": "Karahanlı Devleti, Satuk Buğra Han döneminde İslamiyet'i resmi olarak kabul etmiştir."}, {"cat": "İlk Türk-İslam Devletleri", "q": "Türk-İslam edebiyatının ilk eseri olarak kabul edilen 'Kutadgu Bilig' kim tarafından yazılmıştır?", "opts": ["Yusuf Has Hacip", "Kaşgarlı Mahmut", "Ahmet Yesevi", "Edip Ahmet Yükneki"], "a": 0, "exp": "Kutadgu Bilig, Yusuf Has Hacip tarafından Karahanlılar döneminde yazılmış, Türk-İslam edebiyatının ilk eserlerindendir."}, {"cat": "İlk Türk-İslam Devletleri", "q": "Türkçenin ilk sözlüğü olan 'Divan-ı Lügati't Türk' kime aittir?", "opts": ["Kaşgarlı Mahmut", "Yusuf Has Hacip", "Ahmet Yesevi", "Farabi"], "a": 0, "exp": "Divan-ı Lügati't Türk, Kaşgarlı Mahmut tarafından yazılmış ilk Türkçe sözlüktür."}, {"cat": "İlk Türk-İslam Devletleri", "q": "Anadolu'da tasavvuf akımının öncüsü kabul edilen ve Yesevilik tarikatının kurucusu kimdir?", "opts": ["Ahmet Yesevi", "Hacı Bektaş Veli", "Mevlana", "Yunus Emre"], "a": 0, "exp": "Ahmet Yesevi, Yesevilik tarikatının kurucusudur ve Türkler arasında İslamiyet'in yayılmasında büyük rol oynamıştır."}, {"cat": "İlk Türk-İslam Devletleri", "q": "Tolunoğulları Devleti nerede kurulmuştur?", "opts": ["Mısır", "Horasan", "Maveraünnehir", "Suriye"], "a": 0, "exp": "Tolunoğulları, Mısır'da kurulan ilk Türk-İslam devletlerindendir."}, {"cat": "İlk Türk-İslam Devletleri", "q": "Gazneli Devleti'ni kuran hükümdar kimdir?", "opts": ["Alp Tegin", "Sebük Tegin", "Gazneli Mahmut", "Sultan Mesut"], "a": 1, "exp": "Gazneli Devleti, Sebük Tegin tarafından kurulmuştur; devletin gerçek kurucusu ve en parlak dönemi ise oğlu Gazneli Mahmut zamanındadır."}, {"cat": "İlk Türk-İslam Devletleri", "q": "'Sultan' unvanını kullanan ilk Türk-İslam hükümdarı kimdir?", "opts": ["Gazneli Mahmut", "Tuğrul Bey", "Alparslan", "Melikşah"], "a": 0, "exp": "Gazneli Mahmut, halife tarafından kendisine 'Sultan' unvanı verilen ilk Türk-İslam hükümdarıdır."}, {"cat": "İlk Türk-İslam Devletleri", "q": "Büyük Selçuklu Devleti'nin kurucusu aşağıdakilerden hangisidir?", "opts": ["Tuğrul Bey", "Alparslan", "Melikşah", "Çağrı Bey"], "a": 0, "exp": "Büyük Selçuklu Devleti, Tuğrul Bey tarafından kurulmuştur."}, {"cat": "İlk Türk-İslam Devletleri", "q": "Selçuklu-Gazneli ilişkilerinde dönüm noktası olan ve Selçukluların bağımsızlığını kazandığı savaş aşağıdakilerden hangisidir?", "opts": ["Dandanakan Savaşı", "Katvan Savaşı", "Pasinler Savaşı", "Malazgirt Savaşı"], "a": 0, "exp": "1040 Dandanakan Savaşı ile Selçuklular Gaznelileri yenerek bağımsızlıklarını kazanmış ve devlet resmen kurulmuştur."}, {"cat": "İlk Türk-İslam Devletleri", "q": "Halifeyi Büveyhoğulları baskısından kurtaran ve kendisine 'Doğunun ve Batının Sultanı' unvanı verilen hükümdar kimdir?", "opts": ["Tuğrul Bey", "Alparslan", "Melikşah", "Sencer"], "a": 0, "exp": "Tuğrul Bey, Bağdat'a girerek halifeyi Şii Büveyhoğulları baskısından kurtarmış ve 'Doğunun ve Batının Sultanı' unvanını almıştır."}, {"cat": "İlk Türk-İslam Devletleri", "q": "Büyük Selçuklu Devleti'nin Bizans'a karşı kazandığı ve Anadolu'nun kapılarını Türklere açan savaş aşağıdakilerden hangisidir?", "opts": ["Malazgirt Savaşı", "Miryokefalon Savaşı", "Pasinler Savaşı", "Katvan Savaşı"], "a": 0, "exp": "1071 Malazgirt Savaşı ile Anadolu'nun kapıları Türklere açılmış, Anadolu'nun Türkleşmesi süreci başlamıştır."}, {"cat": "Anadolu Selçuklu Devleti ve Beylikler", "q": "Anadolu'da kurulan ilk Türk beyliği aşağıdakilerden hangisidir?", "opts": ["Saltuklu Beyliği", "Danişmendliler", "Artuklular", "Mengücekliler"], "a": 0, "exp": "Saltuklu Beyliği, Malazgirt Savaşı sonrasında Anadolu'da kurulan ilk Türk beyliklerinden biridir (Erzurum çevresinde)."}, {"cat": "Anadolu Selçuklu Devleti ve Beylikler", "q": "Anadolu Selçuklu Devleti'ni kim kurmuştur?", "opts": ["Süleyman Şah", "Kutalmışoğlu Süleyman Şah", "I. Kılıç Arslan", "II. Kılıç Arslan"], "a": 1, "exp": "Anadolu Selçuklu Devleti, Kutalmışoğlu Süleyman Şah tarafından kurulmuştur; merkez olarak İznik seçilmiştir."}, {"cat": "Anadolu Selçuklu Devleti ve Beylikler", "q": "Haçlı Seferleri'nin başlamasında etkili olan gelişmelerden biri aşağıdakilerden hangisidir?", "opts": ["Anadolu Selçuklu Devleti'nin İznik'i başkent yapması", "Fransız İhtilali", "Rönesans hareketleri", "Sanayi Devrimi"], "a": 0, "exp": "Türklerin Anadolu'da ilerlemesi ve İznik'in başkent yapılması, Bizans'ın Avrupa'dan yardım istemesine ve Haçlı Seferleri'nin başlamasına zemin hazırlamıştır."}, {"cat": "Anadolu Selçuklu Devleti ve Beylikler", "q": "Anadolu Selçuklu Devleti'nin Miryokefalon Savaşı'nı kazanarak Anadolu'nun Türk yurdu olduğunu kesinleştirdiği hükümdar kimdir?", "opts": ["I. Kılıç Arslan", "II. Kılıç Arslan", "I. Alaeddin Keykubat", "I. Gıyaseddin Keyhüsrev"], "a": 1, "exp": "1176 Miryokefalon Savaşı, II. Kılıç Arslan döneminde Bizans'a karşı kazanılmış ve Anadolu'nun Türk yurdu olduğu kesinleşmiştir."}, {"cat": "Anadolu Selçuklu Devleti ve Beylikler", "q": "Anadolu Selçuklu Devleti'nin en parlak dönemi hangi hükümdar zamanında yaşanmıştır?", "opts": ["I. Gıyaseddin Keyhüsrev", "I. Alaeddin Keykubat", "II. Kılıç Arslan", "II. Gıyaseddin Keyhüsrev"], "a": 1, "exp": "Anadolu Selçuklu Devleti'nin en parlak dönemi I. Alaeddin Keykubat zamanında yaşanmıştır."}, {"cat": "Anadolu Selçuklu Devleti ve Beylikler", "q": "Anadolu Selçuklu Devleti'nin yıkılış sürecini hızlandıran ve Moğollara yenildiği savaş aşağıdakilerden hangisidir?", "opts": ["Kösedağ Savaşı", "Miryokefalon Savaşı", "Malazgirt Savaşı", "Yassıçemen Savaşı"], "a": 0, "exp": "1243 Kösedağ Savaşı'nda Anadolu Selçukluları Moğollara yenilmiş, bu tarihten sonra devlet Moğol baskısı altına girmiştir."}, {"cat": "Anadolu Selçuklu Devleti ve Beylikler", "q": "Anadolu Selçuklu Devleti döneminde kervansaraylar hangi amaçla yapılmıştır?", "opts": ["Ticaret yollarının güvenliğini sağlamak ve ticareti geliştirmek", "Askeri kışla olarak kullanmak", "Sadece dini ibadet için", "Sınır savunması için"], "a": 0, "exp": "Kervansaraylar, ticaret yollarının güvenliğini sağlamak, tüccarların konaklamasını ve ticaretin gelişmesini sağlamak amacıyla yapılmıştır."}, {"cat": "Anadolu Selçuklu Devleti ve Beylikler", "q": "Anadolu Selçuklu Devleti'nde şifahane (darüşşifa) olarak bilinen kurumların işlevi nedir?", "opts": ["Hastane olarak hizmet vermek", "Kervansaray olarak hizmet vermek", "Medrese olarak eğitim vermek", "Ordugah olarak kullanılmak"], "a": 0, "exp": "Darüşşifalar, Anadolu Selçuklu ve sonrasında Anadolu beyliklerinde hastane işlevi gören kurumlardır; örnek: Gevher Nesibe Darüşşifası (Kayseri)."}, {"cat": "Anadolu Selçuklu Devleti ve Beylikler", "q": "Anadolu'da kurulan Türkiye Selçuklu Devleti'nin Konya ve Niğde'deki en önemli camileri aşağıdakilerden hangisidir?", "opts": ["Alaaddin Camileri", "Ulu Camiler", "Sahip Ata Camii", "Aslanhane Camii"], "a": 0, "exp": "Konya ve Niğde Alaaddin Camileri, Anadolu Selçuklu Devleti dönemine ait önemli eserlerdendir."}, {"cat": "Anadolu Selçuklu Devleti ve Beylikler", "q": "Anadolu Beylikleri döneminde kurulan Karesioğulları Beyliği'nin Osmanlılara katılması sonucunda Osmanlı Devleti'ne kazandırılan alan aşağıdakilerden hangisidir?", "opts": ["Denizcilik faaliyetleri", "Tımar sistemi", "Devşirme sistemi", "Kapıkulu Ocakları"], "a": 0, "exp": "1345 yılında Karesioğulları Beyliği'nin alınmasıyla Osmanlı Devleti'nde denizcilik faaliyetleri başlamıştır."}, {"cat": "Anadolu Selçuklu Devleti ve Beylikler", "q": "Aşağıdaki Anadolu beyliklerinden hangisi Yavuz Sultan Selim döneminde ortadan kaldırılarak Anadolu Türk siyasi birliği kesin olarak sağlanmıştır?", "opts": ["Karamanoğulları", "Dulkadiroğulları", "Candaroğulları", "Germiyanoğulları"], "a": 1, "exp": "Yavuz Sultan Selim, 1515 Turnadağ Savaşı ile Dulkadiroğulları Beyliği'ni ortadan kaldırarak Anadolu Türk siyasi birliğini kesin olarak sağlamıştır."}, {"cat": "Anadolu Selçuklu Devleti ve Beylikler", "q": "Karamanoğulları Beyliği'ne kesin olarak son veren Osmanlı padişahı kimdir?", "opts": ["Fatih Sultan Mehmed", "II. Bayezid", "Yavuz Sultan Selim", "I. Murad"], "a": 1, "exp": "1487 yılında II. Bayezid döneminde Karamanoğulları Beyliği'ne kesin olarak son verilmiştir."}, {"cat": "Osmanlı Kuruluş Dönemi", "q": "Osmanlı Devleti'ni kuran Osman Bey bağımsızlığını hangi yılda ilan etmiştir?", "opts": ["1299", "1302", "1324", "1281"], "a": 0, "exp": "Osman Bey, 1299 yılında bağımsızlığını ilan etmiştir; bu tarih Osmanlı Devleti'nin kuruluş tarihi kabul edilir."}, {"cat": "Osmanlı Kuruluş Dönemi", "q": "Osmanlıların Bizans ile yaptığı ilk mücadele aşağıdaki savaşlardan hangisidir?", "opts": ["Koyunhisar (Bafeon) Savaşı", "Palekanon Savaşı", "Sırpsındığı Savaşı", "I. Kosova Savaşı"], "a": 0, "exp": "1302 yılında yapılan Koyunhisar (Bafeon) Savaşı, Osmanlıların Bizans ile yaptığı ilk mücadeledir."}, {"cat": "Osmanlı Kuruluş Dönemi", "q": "Osmanlı Beyliği'nde 'devlet' statüsüne geçiş hangi padişah döneminde gerçekleşmiştir?", "opts": ["Osman Bey", "Orhan Bey", "I. Murad", "Yıldırım Bayezid"], "a": 1, "exp": "Orhan Bey döneminde devlet teşkilatının oluşturulmasıyla Osmanlı Beyliği 'devlet' statüsüne geçmiştir."}, {"cat": "Osmanlı Kuruluş Dönemi", "q": "Osmanlı Devleti'nin ilk başkenti aşağıdakilerden hangisidir?", "opts": ["Bursa", "İznik", "Edirne", "Söğüt"], "a": 0, "exp": "1326'da Orhan Bey tarafından fethedilen Bursa, Osmanlı Devleti'nin ilk başkenti olmuştur."}, {"cat": "Osmanlı Kuruluş Dönemi", "q": "Osmanlıların Rumeli'ye (Avrupa yakasına) geçişini sağlayan gelişme aşağıdakilerden hangisidir?", "opts": ["Bizans'ın Çimpe Kalesi'ni Osmanlı'ya vermesi", "Sırpsındığı Savaşı'nın kazanılması", "Edirne'nin fethi", "Niğbolu Savaşı'nın kazanılması"], "a": 0, "exp": "1353 yılında Bizans'ın yardımlarına karşılık Çimpe Kalesi'ni Osmanlı'ya vermesiyle Osmanlılar Rumeli'ye geçmiştir."}, {"cat": "Osmanlı Kuruluş Dönemi", "q": "'Sancak sistemi' ile tahta geçen ve 'sultan' unvanını kullanan ilk Osmanlı padişahı kimdir?", "opts": ["Orhan Bey", "I. Murad", "Yıldırım Bayezid", "I. Mehmed"], "a": 1, "exp": "I. Murad, sancak sistemi ile tahta geçen ve sultan unvanını kullanan ilk Osmanlı hükümdarıdır."}, {"cat": "Osmanlı Kuruluş Dönemi", "q": "Osmanlı Devleti'nin başkentinin Edirne'ye taşınmasını sağlayan savaş aşağıdakilerden hangisidir?", "opts": ["Sazlıdere Savaşı", "Sırpsındığı Savaşı", "I. Kosova Savaşı", "Niğbolu Savaşı"], "a": 0, "exp": "1363 yılında Bizans ve Bulgar Krallığı'na karşı kazanılan Sazlıdere Savaşı ile Edirne alınmış ve başkent Edirne'ye taşınmıştır."}, {"cat": "Osmanlı Kuruluş Dönemi", "q": "Osmanlıların Haçlılarla yaptığı ilk savaş aşağıdakilerden hangisidir?", "opts": ["Sırpsındığı Savaşı", "I. Kosova Savaşı", "Niğbolu Savaşı", "Ankara Savaşı"], "a": 0, "exp": "1364 Sırpsındığı Savaşı, Osmanlıların Haçlılarla yaptığı ilk savaştır ve bu savaşla Bulgar Krallığı ele geçirilmiştir."}, {"cat": "Osmanlı Kuruluş Dönemi", "q": "Osmanlıların Balkanlardan atılamayacağının anlaşıldığı savaş aşağıdakilerden hangisidir?", "opts": ["I. Kosova Savaşı", "Niğbolu Savaşı", "Ankara Savaşı", "Varna Savaşı"], "a": 0, "exp": "1389 I. Kosova Savaşı'nda Osmanlılar galip gelmiş ve Osmanlının Balkanlardan atılamayacağı anlaşılmıştır."}, {"cat": "Osmanlı Kuruluş Dönemi", "q": "Yıldırım Bayezid döneminde Haçlılara karşı kazanılan ve İstanbul'un ilk kuşatılmasına tepki olarak yapılan savaş aşağıdakilerden hangisidir?", "opts": ["Niğbolu Savaşı", "Ankara Savaşı", "Varna Savaşı", "I. Kosova Savaşı"], "a": 0, "exp": "1396 Niğbolu Savaşı, İstanbul'un ilk kez kuşatılması üzerine düzenlenen Haçlı Seferi'ne karşı Osmanlıların kazandığı savaştır."}, {"cat": "Osmanlı Kuruluş Dönemi", "q": "1402 Ankara Savaşı'nda Yıldırım Bayezid kime yenilmiştir?", "opts": ["Timur", "Cengiz Han", "Bizans İmparatoru", "Karamanoğlu"], "a": 0, "exp": "1402 Ankara Savaşı'nda Yıldırım Bayezid, Timur'a yenilmiş ve devlet Fetret Devri'ne girmiştir."}, {"cat": "Osmanlı Kuruluş Dönemi", "q": "Ankara Savaşı'nın en önemli sonucu aşağıdakilerden hangisidir?", "opts": ["Osmanlı Devleti'nin Fetret Devri'ne girmesi", "İstanbul'un fethi", "Anadolu Türk birliğinin sağlanması", "Halifeliğin Osmanlılara geçmesi"], "a": 0, "exp": "Ankara Savaşı'nın en önemli sonucu, Osmanlı Devleti'nin 11 yıl süren Fetret Devri'ne girmesidir."}, {"cat": "Osmanlı Yükselme Dönemi", "q": "İstanbul'u fetheden Osmanlı padişahı kimdir ve fetih hangi yıl gerçekleşmiştir?", "opts": ["Fatih Sultan Mehmed - 1453", "II. Bayezid - 1481", "Yavuz Sultan Selim - 1517", "Kanuni Sultan Süleyman - 1520"], "a": 0, "exp": "İstanbul, 1453 yılında Fatih Sultan Mehmed tarafından fethedilmiştir."}, {"cat": "Osmanlı Yükselme Dönemi", "q": "İstanbul'un fethinin Türk tarihi açısından sonuçlarından biri aşağıdakilerden hangisidir?", "opts": ["Osmanlı toprak bütünlüğü sağlanmış ve devlet imparatorluk haline gelmiştir", "Rönesans başlamıştır", "Yeni Çağ başlamıştır", "1000 yıllık Bizans yıkılmıştır"], "a": 0, "exp": "İstanbul'un fethiyle Osmanlı toprak bütünlüğü sağlanmış, başkent İstanbul'a taşınmış ve devlet imparatorluk haline gelmiştir."}, {"cat": "Osmanlı Yükselme Dönemi", "q": "İstanbul'un fethinin dünya tarihi açısından sonuçlarından biri aşağıdakilerden hangisidir?", "opts": ["Orta Çağ kapanmış, Yeni Çağ başlamıştır", "Osmanlı başkenti İstanbul'a taşınmıştır", "Anadolu Türk birliği sağlanmıştır", "Halifelik Osmanlılara geçmiştir"], "a": 0, "exp": "İstanbul'un fethiyle 1000 yıllık Bizans yıkılmış, Rönesans ve Reform hareketleri başlamış, Orta Çağ kapanıp Yeni Çağ başlamıştır."}, {"cat": "Osmanlı Yükselme Dönemi", "q": "Fatih Sultan Mehmed döneminde Akkoyunlularla yapılan ve Doğu Anadolu'nun alınmasını sağlayan savaş aşağıdakilerden hangisidir?", "opts": ["Otlukbeli Savaşı", "Çaldıran Savaşı", "Mercidabık Savaşı", "Ridaniye Savaşı"], "a": 0, "exp": "1473 Otlukbeli Savaşı'nda Akkoyunlular yenilerek Doğu Anadolu Bölgesi Osmanlı topraklarına katılmıştır."}, {"cat": "Osmanlı Yükselme Dönemi", "q": "Kırım'ın fethiyle Karadeniz'in Türk gölü haline geldiği ve İpek Yolu denetiminin Osmanlılara geçtiği yıl aşağıdakilerden hangisidir?", "opts": ["1475", "1453", "1479", "1461"], "a": 0, "exp": "1475 yılında Kırım'ın fethiyle İpek Yolu'nun denetimi Osmanlılara geçmiş, Karadeniz bir Türk gölü haline gelmiştir."}, {"cat": "Osmanlı Yükselme Dönemi", "q": "II. Bayezid dönemi, dış siyaset açısından sönük geçtiği için Osmanlı tarihinde hangi şekilde nitelendirilmiştir?", "opts": ["Duraklama dönemi olarak", "Gerileme dönemi olarak", "Yükselme dönemi içinde duraklama dönemi olarak", "Dağılma dönemi olarak"], "a": 2, "exp": "II. Bayezid dönemi, Cem Sultan Olayı nedeniyle pasif geçtiği için yükselme dönemi içinde 'duraklama dönemi' olarak tanımlanır."}, {"cat": "Osmanlı Yükselme Dönemi", "q": "Ordu desteği ile tahta çıkan ilk Osmanlı padişahı kimdir?", "opts": ["Yavuz Sultan Selim", "II. Bayezid", "Kanuni Sultan Süleyman", "I. Mehmed"], "a": 0, "exp": "Yavuz Sultan Selim, ordu desteği ile tahta çıkan ilk Osmanlı padişahıdır."}, {"cat": "Osmanlı Yükselme Dönemi", "q": "Yavuz Sultan Selim'in Şah İsmail'i yenilgiye uğrattığı ve Anadolu'da Şiilik propagandasına karşı önemli bir savaş olan mücadele aşağıdakilerden hangisidir?", "opts": ["Çaldıran Savaşı", "Mercidabık Savaşı", "Ridaniye Savaşı", "Otlukbeli Savaşı"], "a": 0, "exp": "1514 Çaldıran Savaşı ile Yavuz Sultan Selim, Safevi hükümdarı Şah İsmail'i yenilgiye uğratmıştır."}, {"cat": "Osmanlı Yükselme Dönemi", "q": "Yavuz Sultan Selim'in Memlukları yenerek Mısır'ı ele geçirdiği savaş aşağıdakilerden hangisidir?", "opts": ["Ridaniye Savaşı", "Mercidabık Savaşı", "Çaldıran Savaşı", "Otlukbeli Savaşı"], "a": 0, "exp": "1517 Ridaniye Savaşı ile Mısır ele geçirilmiş ve Memluk Devleti'ne son verilmiştir."}, {"cat": "Osmanlı Yükselme Dönemi", "q": "Mercidabık Savaşı sonucunda hangi devlet yenilgiye uğratılmıştır?", "opts": ["Memlükler", "Safeviler", "Akkoyunlular", "Dulkadiroğulları"], "a": 0, "exp": "1516 Mercidabık Savaşı ile Memluklar yenilgiye uğratılmıştır."}, {"cat": "Osmanlı Yükselme Dönemi", "q": "Yavuz Sultan Selim döneminde Mısır'ın alınmasının en önemli sonucu aşağıdakilerden hangisidir?", "opts": ["Halifeliğin Osmanlılara geçmesi", "İstanbul'un başkent olması", "Kıbrıs'ın fethi", "Preveze Deniz Zaferi"], "a": 0, "exp": "Mısır'ın ele geçirilmesiyle halifelik Osmanlılara geçmiş, Yavuz Sultan Selim 'Hadim-ül Haremeyn Şerif' unvanını almıştır."}, {"cat": "Osmanlı Yükselme Dönemi", "q": "Kanuni Sultan Süleyman'ın sefer sırasında eceliyle ölen tek Osmanlı padişahı olması hangi seferde gerçekleşmiştir?", "opts": ["Zigetvar Seferi", "Mohaç Seferi", "Rodos Seferi", "Belgrat Seferi"], "a": 0, "exp": "Kanuni Sultan Süleyman, Zigetvar Seferi sırasında eceliyle ölen tek Osmanlı padişahıdır."}, {"cat": "Osmanlı Yükselme Dönemi", "q": "Kanuni Sultan Süleyman döneminde Macar ordusunun bozguna uğratılıp Budin'in alındığı savaş aşağıdakilerden hangisidir?", "opts": ["Mohaç Meydan Savaşı", "I. Viyana Kuşatması", "Preveze Deniz Savaşı", "Zigetvar Seferi"], "a": 0, "exp": "1526 Mohaç Meydan Savaşı ile Macar ordusu bozguna uğratılmış, başkent Budin (Budapeşte) alınmıştır."}, {"cat": "Osmanlı Yükselme Dönemi", "q": "Akdeniz'in bir Türk gölü haline gelmesini sağlayan deniz savaşı aşağıdakilerden hangisidir?", "opts": ["Preveze Deniz Savaşı", "İnebahtı Savaşı", "Çeşme Deniz Savaşı", "Navarin Deniz Savaşı"], "a": 0, "exp": "1538 Preveze Deniz Zaferi ile Haçlı donanması yenilmiş ve Akdeniz bir Türk gölü haline gelmiştir."}, {"cat": "Osmanlı Yükselme Dönemi", "q": "Osmanlı ile İran arasında imzalanan ilk resmi antlaşma aşağıdakilerden hangisidir?", "opts": ["Amasya Antlaşması", "Kasr-ı Şirin Antlaşması", "Zuhab Antlaşması", "İstanbul Antlaşması"], "a": 0, "exp": "1555 Amasya Antlaşması, Osmanlı ile İran (Safeviler) arasında imzalanan ilk resmi antlaşmadır."}, {"cat": "Osmanlı Yükselme Dönemi", "q": "Kıbrıs, hangi Osmanlı padişahı döneminde Venediklilerden alınmıştır?", "opts": ["II. Selim", "Kanuni Sultan Süleyman", "III. Murad", "Yavuz Sultan Selim"], "a": 0, "exp": "1571 yılında II. Selim döneminde Kıbrıs, Venediklilerden alınmıştır."}, {"cat": "Osmanlı Devlet ve Toplum Yapısı", "q": "Osmanlı Devleti'nde padişahın danışma meclisi olan ve devletin en yüksek yargı organı işlevi gören kurum aşağıdakilerden hangisidir?", "opts": ["Divan-ı Hümayun", "Enderun", "Meclis-i Mebusan", "Şura-yı Devlet"], "a": 0, "exp": "Divan-ı Hümayun, Orhan Bey tarafından kurulmuş olup devletin yasama, yürütme ve en yüksek yargı organı işlevini görmüştür."}, {"cat": "Osmanlı Devlet ve Toplum Yapısı", "q": "Divan-ı Hümayun'un başkanlığını Fatih dönemine kadar kim yapmıştır?", "opts": ["Padişahlar", "Sadrazamlar", "Şeyhülislam", "Kazasker"], "a": 0, "exp": "Divan-ı Hümayun'un başkanlığını Fatih Sultan Mehmed dönemine (15. yüzyıla) kadar padişahlar, sonrasında sadrazamlar yapmıştır."}, {"cat": "Osmanlı Devlet ve Toplum Yapısı", "q": "Padişahın mutlak vekili olan ve padişahın katılmadığı seferlerde 'Serdar-ı Ekrem' unvanıyla orduya komuta eden divan üyesi aşağıdakilerden hangisidir?", "opts": ["Veziriazam (Sadrazam)", "Kazasker", "Defterdar", "Nişancı"], "a": 0, "exp": "Veziriazam (Sadrazam), padişahın mutlak vekili olup padişahın katılmadığı seferlerde 'Serdar-ı Ekrem' unvanıyla ordu komutanlığı yapardı."}, {"cat": "Osmanlı Devlet ve Toplum Yapısı", "q": "Divana gelen davalara bakan ve kadı-müderrislerin atanmasından sorumlu olan divan üyesi aşağıdakilerden hangisidir?", "opts": ["Kazasker", "Defterdar", "Nişancı", "Reisülküttap"], "a": 0, "exp": "Kazasker, divana gelen davalara bakar; kadı ve müderrislerin atanmasından sorumludur."}, {"cat": "Osmanlı Devlet ve Toplum Yapısı", "q": "Padişah adına yazılan ferman ve beratlara tuğra çeken divan üyesi aşağıdakilerden hangisidir?", "opts": ["Nişancı", "Defterdar", "Kazasker", "Kaptan-ı Derya"], "a": 0, "exp": "Nişancı, iç ve dış yazışmaları yapar; padişah adına yazılan ferman ve beratlara tuğra çeker."}, {"cat": "Osmanlı Devlet ve Toplum Yapısı", "q": "Divana üye olan ilk Kaptan-ı Derya kimdir?", "opts": ["Barbaros Hayrettin Paşa", "Piri Reis", "Turgut Reis", "Salih Reis"], "a": 0, "exp": "Barbaros Hayrettin Paşa, Divan üyesi olan ilk Kaptan-ı Derya'dır."}, {"cat": "Osmanlı Devlet ve Toplum Yapısı", "q": "Divan kararlarının dine uygunluğu konusunda görüşüne başvurulan ve verdiği karara 'fetva' denilen divan üyesi aşağıdakilerden hangisidir?", "opts": ["Şeyhülislam", "Kazasker", "Nişancı", "Reisülküttap"], "a": 0, "exp": "Şeyhülislam, divanın tabii üyesi olup verdiği dini görüşe (karara) fetva denir."}, {"cat": "Osmanlı Devlet ve Toplum Yapısı", "q": "Osmanlı Devleti'nde toprak sisteminde geliri 100.000 akçeden fazla olan ve padişah, beylerbeyi, sancakbeyi gibi kişilere verilen dirlik türü aşağıdakilerden hangisidir?", "opts": ["Has", "Zeamet", "Tımar", "Malikane"], "a": 0, "exp": "Has, geliri 100.000 akçeden fazla olan ve padişah, divan üyeleri, beylerbeyi, sancakbeylerine verilen dirlik türüdür."}, {"cat": "Osmanlı Devlet ve Toplum Yapısı", "q": "Geliri 3.000-20.000 akçe arasında olan ve saray hizmetlileri ile ordu komutanlarına verilen dirlik türü aşağıdakilerden hangisidir?", "opts": ["Tımar", "Has", "Zeamet", "Ocaklık"], "a": 0, "exp": "Tımar, geliri 3.000-20.000 akçe arasında olan ve saray hizmetlileri, ordu komutanları ile din görevlilerine verilen dirlik türüdür."}, {"cat": "Osmanlı Devlet ve Toplum Yapısı", "q": "Osmanlı Devleti'nde gayrimüslimlerden askerlikten muafiyet karşılığında alınan kelle (şahsi) vergi aşağıdakilerden hangisidir?", "opts": ["Cizye", "Haraç", "Aşar (Öşür)", "Ağnam"], "a": 0, "exp": "Cizye, gayrimüslimlerden askerlikten muafiyet karşılığı alınan kelle/baş (şahsi) vergisidir; çocuk, kadın ve din adamları bu vergiden muaftır."}, {"cat": "Osmanlı Devlet ve Toplum Yapısı", "q": "Müslümanlardan 1/10 oranında ürün üzerinden alınan vergi aşağıdakilerden hangisidir?", "opts": ["Aşar (Öşür)", "Haraç", "Cizye", "İspenç"], "a": 0, "exp": "Aşar (Öşür), Müslümanlardan ürün üzerinden 1/10 oranında alınan ayni bir vergidir."}, {"cat": "Osmanlı Devlet ve Toplum Yapısı", "q": "Osmanlı Devleti'nde devşirme usulüyle oluşturulan ve I. Murad zamanında kurulan asker ocağı aşağıdakilerden hangisidir?", "opts": ["Acemioğlanlar Ocağı", "Tımarlı Sipahi", "Akıncılar", "Azaplar"], "a": 0, "exp": "Acemioğlanlar Ocağı, I. Murad zamanında devşirme usulüyle kurulmuş olup Kapıkulu Ocaklarının temelini oluşturmuştur."}, {"cat": "Osmanlı Devlet ve Toplum Yapısı", "q": "Osmanlı ordusunda dirlik (tımar) sistemine bağlı olarak atlı ve Türklerden oluşan eyalet askerleri aşağıdakilerden hangisidir?", "opts": ["Tımarlı Sipahiler", "Yeniçeriler", "Kapıkulu Süvarileri", "Azaplar"], "a": 0, "exp": "Tımarlı Sipahiler, dirlik (tımar) sistemine bağlı olarak yetişen ve Türklerden oluşan eyalet askerleridir."}, {"cat": "Osmanlı Devlet ve Toplum Yapısı", "q": "Sınırlarda görev yapan, düşman ordularına akın yapan ve orduya keşif hizmeti veren atlı birlikler aşağıdakilerden hangisidir?", "opts": ["Akıncılar", "Yeniçeriler", "Tımarlı Sipahiler", "Azaplar"], "a": 0, "exp": "Akıncılar, sınırlarda (uç/serhad) görev yapan, düşman ordularına akın yapan ve keşif hizmeti veren atlı birliklerdir; en ünlü akıncı beyleri Malkoçoğlu, Mihaloğlu ve Turhanbeyoğullarıdır."}, {"cat": "Osmanlı Devlet ve Toplum Yapısı", "q": "Osmanlı Devleti'nde ilk tersanenin açıldığı padişah dönemi aşağıdakilerden hangisidir?", "opts": ["I. Bayezid", "Orhan Bey", "Fatih Sultan Mehmed", "II. Bayezid"], "a": 0, "exp": "I. Bayezid zamanında Gelibolu'da Osmanlının ilk tersanesi açılmıştır."}, {"cat": "Osmanlı Devlet ve Toplum Yapısı", "q": "Osmanlı Devleti'nde ilmiye sınıfının yetiştiği eğitim kurumu aşağıdakilerden hangisidir?", "opts": ["Medrese", "Enderun", "Şehzadegan Mektebi", "Harem"], "a": 0, "exp": "İlmiye (Ulema) sınıfı, medresede eğitim görerek yetişirdi."}, {"cat": "Duraklama Dönemi (17. yy)", "q": "17. yüzyıl ıslahatlarının genel özelliği için aşağıdakilerden hangisi söylenemez?", "opts": ["Avrupa örnek alınarak batılılaşma amacı güdülmüştür", "Düşünce aşamasında kalmıştır", "Devlet otoritesi baskı ve şiddetle sağlanmaya çalışılmıştır", "Kişilerin ömrüyle sınırlı kalmıştır"], "a": 0, "exp": "17. yüzyıl ıslahatlarında Avrupa örnek alınmamış, batılılaşma amacı güdülmemiştir; bu dönem ıslahatları genellikle düşünce aşamasında kalmıştır."}, {"cat": "Duraklama Dönemi (17. yy)", "q": "I. Ahmet döneminde taht kavgalarını önlemek amacıyla başlatılan ve hanedanın en yaşlı üyesinin padişah olmasını öngören sistem aşağıdakilerden hangisidir?", "opts": ["Ekber ve Erşed Sistemi", "Kafes Sistemi", "Şehzade Sancak Sistemi", "Meşveret Sistemi"], "a": 0, "exp": "I. Ahmet, taht kavgalarını önlemek amacıyla Ekber ve Erşed sistemini başlatmış ve veraset sistemini belirgin kılmıştır."}, {"cat": "Duraklama Dönemi (17. yy)", "q": "Celali isyanlarını şiddet yoluyla bastıran I. Ahmet'in sadrazamı kimdir?", "opts": ["Kuyucu Murat Paşa", "Köprülü Mehmet Paşa", "Sokullu Mehmet Paşa", "Tarhuncu Ahmet Paşa"], "a": 0, "exp": "Kuyucu Murat Paşa, I. Ahmet'in sadrazamı olup Celali isyanlarını şiddet yoluyla bastırmıştır."}, {"cat": "Duraklama Dönemi (17. yy)", "q": "Askeri alanda yenilik hareketlerine girişen ve Yeniçeri Ocağı'nı kaldırmayı düşündüğü için öldürülen Osmanlı padişahı kimdir?", "opts": ["II. (Genç) Osman", "IV. Murad", "I. Ahmet", "I. Mustafa"], "a": 0, "exp": "II. (Genç) Osman, Yeniçeri Ocağı'nı kaldırmayı düşünmüş ancak bu düşüncesi ortaya çıkınca yeniçeriler tarafından öldürülmüştür."}, {"cat": "Duraklama Dönemi (17. yy)", "q": "Osmanlı'da denk bütçeyi hazırlayan ilk kişi olarak bilinen ve IV. Mehmet'in sadrazamı olan devlet adamı kimdir?", "opts": ["Tarhuncu Ahmet Paşa", "Köprülü Mehmet Paşa", "Kuyucu Murat Paşa", "Fazıl Ahmet Paşa"], "a": 0, "exp": "Tarhuncu Ahmet Paşa, IV. Mehmet'in sadrazamı olup Osmanlı'da denk bütçeyi hazırlayan ilk kişidir."}, {"cat": "Duraklama Dönemi (17. yy)", "q": "Sert tedbirlerle devlet otoritesini yeniden sağlayan, Koçi Bey Risalesi'nin sunulduğu padişah kimdir?", "opts": ["IV. Murad", "II. Osman", "I. Ahmet", "IV. Mehmet"], "a": 0, "exp": "IV. Murad döneminde Koçi Bey, duraklamanın nedenlerini ve çözüm yollarını belirten bir rapor (risale) sunmuştur."}, {"cat": "Duraklama Dönemi (17. yy)", "q": "Şartlar ileri sürerek sadrazamlığı kabul eden ilk kişi olan ve 'Köprülüler Devri'ni başlatan devlet adamı kimdir?", "opts": ["Köprülü Mehmet Paşa", "Kuyucu Murat Paşa", "Tarhuncu Ahmet Paşa", "Sokullu Mehmet Paşa"], "a": 0, "exp": "Köprülü Mehmet Paşa, şartlar ileri sürerek sadrazamlığı kabul eden ilk kişidir; orduyu disiplin altına almış ve hazinenin yükünü hafifletmiştir."}, {"cat": "Duraklama Dönemi (17. yy)", "q": "Köprülüler dönemi Osmanlı tarihinde nasıl adlandırılır?", "opts": ["Duraklama içinde yükselme devri", "Gerileme devri", "Dağılma devri", "İkinci kuruluş devri"], "a": 0, "exp": "Köprülüler devri, duraklama içinde yükselme devri olarak adlandırılır."}, {"cat": "Gerileme Dönemi (18. yy Islahatları)", "q": "18. yüzyıl ıslahatları hangi antlaşmayla başlamıştır?", "opts": ["1699 Karlofça Antlaşması", "1718 Pasarofça Antlaşması", "1774 Küçük Kaynarca Antlaşması", "1739 Belgrad Antlaşması"], "a": 0, "exp": "1699 Karlofça Antlaşması ile başlayan 18. yüzyılda Osmanlı Devleti daha somut çözümler üretmiş fakat gerileme önlenememiştir."}, {"cat": "Gerileme Dönemi (18. yy Islahatları)", "q": "Lale Devri hangi padişah ve sadrazamı döneminde yaşanmıştır?", "opts": ["III. Ahmet - Nevşehirli Damat İbrahim Paşa", "III. Selim - Koca Yusuf Paşa", "I. Mahmut - Humbaracı Ahmet Paşa", "III. Mustafa - Koca Ragıp Paşa"], "a": 0, "exp": "Lale Devri (1718-1730), padişah III. Ahmet ve sadrazamı Nevşehirli Damat İbrahim Paşa döneminde yaşanmıştır."}, {"cat": "Gerileme Dönemi (18. yy Islahatları)", "q": "Avrupa'ya ilk geçici elçi olarak gönderilen ve 'Sefaretname' adlı eseriyle Osmanlı ıslahat hareketlerine kaynak oluşturan kişi kimdir?", "opts": ["Yirmisekiz Mehmet Çelebi", "İbrahim Müteferrika", "Koca Yusuf Paşa", "Ahmet Resmi Efendi"], "a": 0, "exp": "28 (Yirmisekiz) Mehmet Çelebi, Paris'e geçici elçi olarak gönderilmiş, yazdığı Sefaretname ile Osmanlı ıslahat hareketlerine kaynak oluşturmuştur."}, {"cat": "Gerileme Dönemi (18. yy Islahatları)", "q": "İlk Türk matbaasını kimlerle birlikte kuran kişi kimdir?", "opts": ["İbrahim Müteferrika", "Yirmisekiz Mehmet Çelebi", "Ahmet Cevdet Paşa", "Şinasi"], "a": 0, "exp": "İlk Türk matbaası, İbrahim Müteferrika ve Said Efendi tarafından 1727'de kurulmuştur; ilk basılan eser Vankulu Lügati'dir."}, {"cat": "Gerileme Dönemi (18. yy Islahatları)", "q": "Lale Devri'nin sona ermesine neden olan isyan aşağıdakilerden hangisidir?", "opts": ["Patrona Halil İsyanı", "Kabakçı Mustafa İsyanı", "Şeyh Sait İsyanı", "31 Mart Ayaklanması"], "a": 0, "exp": "Lale Devri, 1730 yılında çıkan Patrona Halil İsyanı ile sona ermiştir."}, {"cat": "Gerileme Dönemi (18. yy Islahatları)", "q": "Sürat Topçuları Ocağı'nı kuran ve topçu ocağını ıslah eden Fransız asıllı uzman kimdir?", "opts": ["Baron de Tott", "Humbaracı Ahmet Paşa (Kont Boneval)", "Moltke", "Kont de Bonneval"], "a": 0, "exp": "III. Mustafa döneminde Fransa'dan getirilen Baron de Tott, topçu ocağını ıslah etmiş ve Sürat Topçuları Ocağı'nı kurmuştur."}, {"cat": "Gerileme Dönemi (18. yy Islahatları)", "q": "III. Selim döneminde başlatılan köklü değişim hareketine ne ad verilir?", "opts": ["Nizam-ı Cedit", "Tanzimat", "Islahat", "Meşrutiyet"], "a": 0, "exp": "III. Selim, Osmanlı Devleti'nde radikal (köklü) değişim hareketini başlatan padişahtır; bu harekete 'Nizam-ı Cedit' denir."}, {"cat": "Gerileme Dönemi (18. yy Islahatları)", "q": "III. Selim'in Avrupa'da açtığı ilk daimi elçilik nerededir?", "opts": ["Londra", "Paris", "Viyana", "Berlin"], "a": 0, "exp": "III. Selim döneminde Avrupa'da daimi elçilikler açılmış, ilk daimi elçi Londra'ya Yusuf Agah Efendi olarak gönderilmiştir."}, {"cat": "Dağılma Dönemi (19. yy Siyasi Durum)", "q": "Avrupa'nın güçlü devletlerinin Osmanlı Devleti'ne ait toprakları paylaşma meselesini adlandırdığı kavram aşağıdakilerden hangisidir?", "opts": ["Doğu Sorunu (Şark Meselesi)", "Panslavizm", "Denge Siyaseti", "Kapitülasyonlar Sorunu"], "a": 0, "exp": "Avrupa'nın güçlü devletleri, Osmanlı Devleti'ne ait toprakları paylaşma meselesini 'Doğu Sorunu (Şark Meselesi)' olarak adlandırmıştır."}, {"cat": "Dağılma Dönemi (19. yy Siyasi Durum)", "q": "Osmanlı Devleti'ne 'Hasta Adam' lakabını kullanan ilk ülke ve hükümdarı kimdir?", "opts": ["Rusya - Çar I. Nikolay", "İngiltere - Kraliçe Victoria", "Fransa - III. Napolyon", "Avusturya - I. Franz"], "a": 0, "exp": "Rus Çarı I. Nikolay, 1853'te St. Petersburg'da Osmanlı Devleti için 'Hasta Adam' tabirini kullanmıştır."}, {"cat": "Dağılma Dönemi (19. yy Siyasi Durum)", "q": "Ayanlar ile II. Mahmut arasında imzalanan ve padişahın yetkilerinin kısıtlandığı ilk belge aşağıdakilerden hangisidir?", "opts": ["Sened-i İttifak", "Tanzimat Fermanı", "Islahat Fermanı", "Kanun-i Esasi"], "a": 0, "exp": "1808 Sened-i İttifak, Osmanlı Devleti'nde padişahın yetkilerinin kısıtlandığı ilk belgedir."}, {"cat": "Dağılma Dönemi (19. yy Siyasi Durum)", "q": "Yeniçeri Ocağı'nın kaldırıldığı olay aşağıdakilerden hangisidir?", "opts": ["Vaka-i Hayriye", "Sened-i İttifak", "Kabakçı Mustafa İsyanı", "Şeyh Sait İsyanı"], "a": 0, "exp": "1826'da 'Vaka-i Hayriye' denilen olayla Yeniçeri Ocağı kapatılmış, yerine Asakir-i Mansure-i Muhammediye kurulmuştur."}, {"cat": "Dağılma Dönemi (19. yy Siyasi Durum)", "q": "Yunanistan'ın bağımsızlığını kazanmasını sağlayan antlaşma aşağıdakilerden hangisidir?", "opts": ["1829 Edirne Antlaşması", "1856 Paris Antlaşması", "1878 Berlin Antlaşması", "1841 Londra Boğazlar Sözleşmesi"], "a": 0, "exp": "1829 Edirne Antlaşması ile Yunanlılar bağımsız olmuş; Osmanlı'dan bağımsızlığını kazanan ilk azınlık Yunanlılar olmuştur."}, {"cat": "Dağılma Dönemi (19. yy Siyasi Durum)", "q": "Kavalalı Mehmet Ali Paşa İsyanı'nın çözümünde Osmanlı'nın Rusya ile imzaladığı ve 'Boğazlar Sorunu'nu ortaya çıkaran antlaşma aşağıdakilerden hangisidir?", "opts": ["Hünkar İskelesi Antlaşması", "Londra Antlaşması", "Boğazlar Sözleşmesi", "Paris Antlaşması"], "a": 0, "exp": "1833 Hünkar İskelesi Antlaşması, Mısır Sorunu'nun çözümü için Rusya ile imzalanmış ve Boğazlar Sorunu'nu ortaya çıkarmıştır."}, {"cat": "Dağılma Dönemi (19. yy Siyasi Durum)", "q": "Mısır Sorunu'nun tamamen ortadan kalkmasını sağlayan antlaşma aşağıdakilerden hangisidir?", "opts": ["1840 Londra Antlaşması", "1833 Hünkar İskelesi Antlaşması", "1841 Londra Boğazlar Sözleşmesi", "1856 Paris Antlaşması"], "a": 0, "exp": "1840'ta imzalanan Londra Antlaşması ile Mısır Sorunu ortadan kaldırılmıştır."}, {"cat": "Dağılma Dönemi (19. yy Siyasi Durum)", "q": "Kırım Savaşı hangi devletler arasında yapılmıştır?", "opts": ["Osmanlı-Rusya", "Osmanlı-Avusturya", "Osmanlı-İngiltere", "Osmanlı-Fransa"], "a": 0, "exp": "1853-1856 Kırım Savaşı, Osmanlı Devleti ile Rusya arasında yapılmış; Osmanlı, İngiltere ve Fransa'nın desteğiyle savaşı kazanmıştır."}, {"cat": "Dağılma Dönemi (19. yy Siyasi Durum)", "q": "Kırım Savaşı'nı sona erdiren ve Osmanlı toprak bütünlüğünü Avrupalı devletlerce güvence altına alan antlaşma aşağıdakilerden hangisidir?", "opts": ["1856 Paris Antlaşması", "1878 Berlin Antlaşması", "1841 Londra Boğazlar Sözleşmesi", "1829 Edirne Antlaşması"], "a": 0, "exp": "Kırım Savaşı, 1856 Paris Antlaşması ile sona ermiş, Osmanlı toprak bütünlüğü Avrupalı devletlerce Rusya'ya karşı korunmuştur."}, {"cat": "Dağılma Dönemi (19. yy Siyasi Durum)", "q": "93 Harbi olarak da bilinen ve 1878 Ayastefanos Antlaşması ile sonuçlanan savaş aşağıdakilerden hangisidir?", "opts": ["1877-1878 Osmanlı-Rus Savaşı", "Kırım Savaşı", "Balkan Savaşları", "I. Dünya Savaşı"], "a": 0, "exp": "1877-1878 Osmanlı-Rus Savaşı (93 Harbi), Osmanlı'nın yenilgisiyle sonuçlanmış ve 1878 Ayastefanos (Yeşilköy) Antlaşması imzalanmıştır."}, {"cat": "Tanzimat, Islahat Fermanı ve Meşrutiyet", "q": "Tanzimat Fermanı'nı hazırlayan devlet adamı kimdir?", "opts": ["Mustafa Reşit Paşa", "Ali Paşa", "Mithat Paşa", "Ahmet Cevdet Paşa"], "a": 0, "exp": "Tanzimat Fermanı (Gülhane Hatt-ı Hümayunu), Mustafa Reşit Paşa tarafından hazırlanmış ve 3 Kasım 1839'da Padişah Abdülmecit onayıyla ilan edilmiştir."}, {"cat": "Tanzimat, Islahat Fermanı ve Meşrutiyet", "q": "Tanzimat Fermanı hangi padişah döneminde ilan edilmiştir?", "opts": ["Abdülmecit", "II. Mahmud", "Abdülaziz", "II. Abdülhamit"], "a": 0, "exp": "Tanzimat Fermanı, 3 Kasım 1839'da Padişah Abdülmecit döneminde ilan edilmiştir."}, {"cat": "Tanzimat, Islahat Fermanı ve Meşrutiyet", "q": "Tanzimat Fermanı ile ilgili aşağıdaki ifadelerden hangisi yanlıştır?", "opts": ["Bir anayasadır", "Yönetimde kanun üstünlüğü ilk kez kabul edilmiştir", "Osmanlıcılık anlayışıyla hazırlanmıştır", "Padişahın kendi iradesiyle ilan edilmiştir"], "a": 0, "exp": "Tanzimat Fermanı bir anayasa değildir; anayasal sürecin başlangıcı olarak kabul edilir."}, {"cat": "Tanzimat, Islahat Fermanı ve Meşrutiyet", "q": "1838 yılında İngilizlerin desteğini sağlamak amacıyla imzalanan ve Osmanlı ekonomisini olumsuz etkileyen antlaşma aşağıdakilerden hangisidir?", "opts": ["Balta Limanı Ticaret Sözleşmesi", "Hünkar İskelesi Antlaşması", "Paris Antlaşması", "Londra Antlaşması"], "a": 0, "exp": "1838 Balta Limanı Ticaret Sözleşmesi, İngiltere ile imzalanmış ve Osmanlı ekonomisini olumsuz etkilemiştir."}, {"cat": "Tanzimat, Islahat Fermanı ve Meşrutiyet", "q": "Islahat Fermanı hangi yıl ve hangi konferans sürecinde ilan edilmiştir?", "opts": ["1856 - Paris Konferansı", "1839 - Tanzimat süreci", "1876 - Meşrutiyet süreci", "1908 - İkinci Meşrutiyet süreci"], "a": 0, "exp": "Islahat Fermanı, 1856 yılında Paris Konferansı'nda Osmanlı lehine kararlar alınmasını sağlamak amacıyla ilan edilmiştir."}, {"cat": "Tanzimat, Islahat Fermanı ve Meşrutiyet", "q": "Islahat Fermanı'nın temel amacı aşağıdakilerden hangisidir?", "opts": ["Azınlık isyanlarını ve dış müdahaleleri önlemek", "Meşrutiyeti ilan etmek", "Halifeliği kaldırmak", "Yeniçeriliği kaldırmak"], "a": 0, "exp": "Islahat Fermanı, Avrupa devletlerinin güvenini kazanmak, azınlık isyanlarını ve dış müdahaleleri önlemek amacıyla ilan edilmiştir."}, {"cat": "Tanzimat, Islahat Fermanı ve Meşrutiyet", "q": "İlk Osmanlı anayasası olan Kanun-i Esasi'yi hazırlayan kurulun başkanı kimdir?", "opts": ["Mithat Paşa", "Mustafa Reşit Paşa", "Ahmet Cevdet Paşa", "Namık Kemal"], "a": 0, "exp": "Mithat Paşa, ilk Osmanlı anayasası olan Kanun-i Esasi'yi hazırlayan kurulun başkanıdır."}, {"cat": "Tanzimat, Islahat Fermanı ve Meşrutiyet", "q": "I. Meşrutiyet (Kanun-i Esasi) hangi tarihte ilan edilmiştir?", "opts": ["23 Aralık 1876", "23 Temmuz 1908", "3 Kasım 1839", "1 Kasım 1922"], "a": 0, "exp": "I. Meşrutiyet (Kanun-i Esasi), 23 Aralık 1876'da II. Abdülhamit tarafından ilan edilmiştir."}, {"cat": "Tanzimat, Islahat Fermanı ve Meşrutiyet", "q": "Genç Osmanlılar (Jön Türkler) hangi düşünceyi savunmuşlardır?", "opts": ["Osmanlıcılık", "Türkçülük", "İslamcılık", "Batıcılık"], "a": 0, "exp": "Genç Osmanlılar, Osmanlı'yı oluşturan etnik unsurların Osmanlıcılık düşüncesi etrafında birleştirilmesini savunmuşlardır."}, {"cat": "Tanzimat, Islahat Fermanı ve Meşrutiyet", "q": "II. Abdülhamit'in Osmanlı-Rus Savaşı'nı (93 Harbi) bahane ederek yaptığı işlem aşağıdakilerden hangisidir?", "opts": ["Meclisi kapatması", "Meşrutiyeti ilan etmesi", "Kanun-i Esasi'yi kabul etmesi", "Sadrazamı azletmesi"], "a": 0, "exp": "II. Abdülhamit, 1877-1878 Osmanlı-Rus Savaşı'nı (93 Harbi) bahane ederek meclisi kapatmıştır."}, {"cat": "Tanzimat, Islahat Fermanı ve Meşrutiyet", "q": "1878-1908 yılları arasında meclisin kapalı olduğu döneme ne ad verilir?", "opts": ["İstibdat (Baskı) Dönemi", "Tanzimat Dönemi", "Meşrutiyet Dönemi", "Islahat Dönemi"], "a": 0, "exp": "1878'de meclisin kapatılmasından 1908'de Meşrutiyet'in ikinci kez ilanına kadar geçen süreye İstibdat (Baskı) Dönemi denir."}, {"cat": "Tanzimat, Islahat Fermanı ve Meşrutiyet", "q": "İstibdat Dönemi'nde Osmanlı'nın mali iflasını duyuran kararname aşağıdakilerden hangisidir?", "opts": ["Muharrem Kararnamesi", "Islahat Fermanı", "Tanzimat Fermanı", "Kanun-i Esasi"], "a": 0, "exp": "1881 yılında yayınlanan Muharrem Kararnamesi ile Osmanlı mali iflasını duyurmuştur."}, {"cat": "Tanzimat, Islahat Fermanı ve Meşrutiyet", "q": "II. Meşrutiyet hangi tarihte ilan edilmiştir?", "opts": ["23 Temmuz 1908", "23 Aralık 1876", "10 Temmuz 1908", "31 Mart 1909"], "a": 0, "exp": "II. Meşrutiyet, İttihat ve Terakki'nin çabalarıyla 23 Temmuz 1908'de ilan edilmiştir."}, {"cat": "Tanzimat, Islahat Fermanı ve Meşrutiyet", "q": "II. Meşrutiyet'in ilanına zemin hazırlayan görüşme aşağıdakilerden hangisidir?", "opts": ["Reval Görüşmeleri", "Bilecik Görüşmesi", "Amasya Görüşmesi", "Londra Konferansı"], "a": 0, "exp": "1908'de İngiltere ile Rusya arasında yapılan Reval Görüşmeleri, İttihat ve Terakki'ye bağlı subayları harekete geçirerek II. Meşrutiyet'in ilanına zemin hazırlamıştır."}, {"cat": "Tanzimat, Islahat Fermanı ve Meşrutiyet", "q": "31 Mart Ayaklanması'nın bastırılmasında kurmay başkanlığını Mustafa Kemal'in yaptığı ordu aşağıdakilerden hangisidir?", "opts": ["Hareket Ordusu", "Yıldırım Orduları Grubu", "Kuva-i Milliye", "Kuva-i İnzibatiye"], "a": 0, "exp": "31 Mart Ayaklanması, komutanlığını Mahmut Şevket Paşa'nın, kurmay başkanlığını Mustafa Kemal'in yaptığı Hareket Ordusu tarafından bastırılmıştır."}, {"cat": "Tanzimat, Islahat Fermanı ve Meşrutiyet", "q": "31 Mart Ayaklanması sonrasında tahttan indirilen ve yerine V. Mehmet (Reşat)'ın padişah olduğu hükümdar kimdir?", "opts": ["II. Abdülhamit", "Abdülaziz", "V. Murat", "Abdülmecit"], "a": 0, "exp": "31 Mart Ayaklanması sonrasında II. Abdülhamit tahttan indirilmiş, yerine V. Mehmet (Reşat) padişah olmuştur."}, {"cat": "20. Yüzyıl Başında Osmanlı Devleti", "q": "Trablusgarp Savaşı hangi devletle yapılmıştır?", "opts": ["İtalya", "Fransa", "İngiltere", "Rusya"], "a": 0, "exp": "1911-1912 Trablusgarp Savaşı, sömürge elde etmek isteyen İtalya'nın Trablusgarp'a saldırmasıyla başlamıştır."}, {"cat": "20. Yüzyıl Başında Osmanlı Devleti", "q": "Trablusgarp Savaşı'nı sona erdiren antlaşma aşağıdakilerden hangisidir?", "opts": ["Ouchi (Uşi) Antlaşması", "Londra Antlaşması", "Bükreş Antlaşması", "İstanbul Antlaşması"], "a": 0, "exp": "18 Ekim 1912'de imzalanan Ouchi (Uşi) Antlaşması ile Trablusgarp İtalya'ya bırakılmıştır."}, {"cat": "20. Yüzyıl Başında Osmanlı Devleti", "q": "Mustafa Kemal'in sömürgeciliğe karşı ilk mücadelesi hangi savaşta gerçekleşmiştir?", "opts": ["Trablusgarp Savaşı", "Balkan Savaşları", "I. Dünya Savaşı", "Kurtuluş Savaşı"], "a": 0, "exp": "Mustafa Kemal'in sömürgeciliğe karşı ilk mücadelesi Trablusgarp Savaşı'dır; Derne ve Tobruk'ta görev yapmıştır."}, {"cat": "20. Yüzyıl Başında Osmanlı Devleti", "q": "I. Balkan Savaşı'na katılmayan Balkan devleti aşağıdakilerden hangisidir?", "opts": ["Romanya", "Yunanistan", "Sırbistan", "Bulgaristan"], "a": 0, "exp": "Romanya, I. Balkan Savaşı'na katılmayan tek Balkan devletidir."}, {"cat": "20. Yüzyıl Başında Osmanlı Devleti", "q": "I. Balkan Savaşı sonunda bağımsızlığını ilan eden ve Osmanlı'dan ayrılan son Balkan devleti aşağıdakilerden hangisidir?", "opts": ["Arnavutluk", "Bulgaristan", "Sırbistan", "Karadağ"], "a": 0, "exp": "I. Balkan Savaşı sonunda Arnavutluk bağımsızlığını ilan etmiştir; Osmanlı'dan ayrılan son Balkan devletidir."}, {"cat": "20. Yüzyıl Başında Osmanlı Devleti", "q": "İttihatçıların yaptığı hükümet darbesi olan ve İttihatçıları iktidarın tek sahibi haline getiren olay aşağıdakilerden hangisidir?", "opts": ["Bab-ı Ali Baskını", "31 Mart Ayaklanması", "Kabakçı Mustafa İsyanı", "Menemen Ayaklanması"], "a": 0, "exp": "1913 Bab-ı Ali Baskını, İttihatçıların gerçekleştirdiği bir hükümet darbesidir ve bu darbe sonrasında İttihatçılar iktidarın tek sahibi haline gelmiştir."}, {"cat": "20. Yüzyıl Başında Osmanlı Devleti", "q": "II. Balkan Savaşı'nı sona erdiren antlaşma aşağıdakilerden hangisidir?", "opts": ["1913 Bükreş Antlaşması", "1913 Londra Antlaşması", "1913 İstanbul Antlaşması", "1913 Atina Antlaşması"], "a": 0, "exp": "II. Balkan Savaşı, Balkan devletlerinin kendi aralarında yaptıkları 1913 Bükreş Antlaşması ile sona ermiştir."}, {"cat": "20. Yüzyıl Başında Osmanlı Devleti", "q": "Balkan Savaşları sonucunda Osmanlı Devleti'nin kaybettiği topraklar arasında aşağıdakilerden hangisi yoktur?", "opts": ["Mısır", "Makedonya", "Batı Trakya", "Arnavutluk"], "a": 0, "exp": "Mısır, Balkan Savaşları'yla değil daha önce İngiltere'nin işgaliyle (1882) Osmanlı'dan kopmuştur; Makedonya, Batı Trakya ve Arnavutluk Balkan Savaşları'nda kaybedilmiştir."}, {"cat": "I. Dünya Savaşı ve Osmanlı Cepheleri", "q": "Sarıkamış Harekatı'nın amaçları arasında aşağıdakilerden hangisi yer almaz?", "opts": ["Süveyş Kanalı'nı ele geçirmek", "Rusları Kafkaslardan çıkarmak", "Bakü petrollerini ele geçirmek", "Turancılık idealini gerçekleştirmek"], "a": 0, "exp": "Süveyş Kanalı'nı ele geçirmek Kanal (Süveyş) Cephesi'nin amacıdır; Sarıkamış Harekatı'nın amaçları Rusları Kafkaslardan çıkarmak, Bakü petrollerini ele geçirmek ve Turancılık idealini gerçekleştirmektir."}, {"cat": "I. Dünya Savaşı ve Osmanlı Cepheleri", "q": "Çanakkale Cephesi'nde itilaf devletlerinin donanmasının çarptığı ve ağır kayıplar aldığı Türk gemisinin döşediği unsur aşağıdakilerden hangisidir?", "opts": ["Nusret mayın gemisinin döşediği mayınlar", "Topçu bataryaları", "Denizaltılar", "Zırhlılar"], "a": 0, "exp": "İtilaf donanması, Nusret mayın gemisinin boğazlara döşediği mayınlara çarparak ağır kayıplar vermiş ve geri çekilmiştir."}, {"cat": "I. Dünya Savaşı ve Osmanlı Cepheleri", "q": "Çanakkale Cephesi'nde 19. Tümen Komutanı olarak Anafartalar, Conkbayırı gibi cephelerde savunma yapan komutan kimdir?", "opts": ["Mustafa Kemal", "Enver Paşa", "Cemal Paşa", "Fahrettin Paşa"], "a": 0, "exp": "Mustafa Kemal, 19. Tümen Komutanı olarak Anafartalar, Kireçtepe, Conkbayırı, Arıburnu gibi cephelerde savunma yaparak itilaf devletlerini geri çekilmeye zorlamıştır."}, {"cat": "I. Dünya Savaşı ve Osmanlı Cepheleri", "q": "Çanakkale Savaşı'nın sonuçlarından biri aşağıdakilerden hangisidir?", "opts": ["I. Dünya Savaşı'nın süresi uzamıştır", "Rusya savaştan çekilmiştir", "Osmanlı Devleti savaşa girmiştir", "Mondros Ateşkesi imzalanmıştır"], "a": 0, "exp": "Çanakkale Cephesi'nin sonuçlarından biri, I. Dünya Savaşı'nın süresinin uzamasıdır; ayrıca Bulgaristan ittifak bloğuna katılmış, Rusya'ya yardım götürülemediği için Bolşevik İhtilali önlenememiştir."}, {"cat": "I. Dünya Savaşı ve Osmanlı Cepheleri", "q": "Kutü'l Amare'de İngilizlere ağır kayıplar verdiren Osmanlı komutanı kimdir?", "opts": ["Halil Paşa", "Fahrettin Paşa", "Kazım Karabekir", "Ali İhsan Paşa"], "a": 0, "exp": "Irak (Basra) Cephesi'nde Halil Paşa komutasındaki Osmanlı kuvvetleri, İngilizlere Kutü'l Amare'de ağır kayıplar verdirmiştir."}, {"cat": "I. Dünya Savaşı ve Osmanlı Cepheleri", "q": "Medine savunmasıyla 'Çöl Kaplanı' unvanını alan Osmanlı komutanı kimdir?", "opts": ["Fahrettin Paşa", "Halil Paşa", "Kazım Karabekir", "Cemal Paşa"], "a": 0, "exp": "Hicaz-Yemen Cephesi'nde Fahrettin Paşa, Medine savunmasındaki başarısıyla 'Çöl Kaplanı' olarak anılmıştır."}, {"cat": "I. Dünya Savaşı ve Osmanlı Cepheleri", "q": "Kanal (Süveyş) Cephesi'nde Osmanlı ordusuna komuta eden ve İngilizlere mağlup olan komutan kimdir?", "opts": ["Cemal Paşa", "Enver Paşa", "Fahrettin Paşa", "Halil Paşa"], "a": 0, "exp": "Kanal Cephesi'nde Cemal Paşa komutasındaki Osmanlı ordusu, beklenen Alman yardımı gelmediği için İngilizlere mağlup olmuştur."}, {"cat": "I. Dünya Savaşı ve Osmanlı Cepheleri", "q": "I. Dünya Savaşı sonunda Osmanlı Devleti'nin imzaladığı ateşkes antlaşması aşağıdakilerden hangisidir?", "opts": ["Mondros Ateşkes Antlaşması", "Selanik Ateşkes Antlaşması", "Rethondes Ateşkes Antlaşması", "Villa Giusti Ateşkes Antlaşması"], "a": 0, "exp": "Osmanlı Devleti, 30 Ekim 1918'de Mondros Ateşkes Antlaşması'nı imzalamıştır."}, {"cat": "I. Dünya Savaşı ve Osmanlı Cepheleri", "q": "I. Dünya Savaşı sırasında Osmanlı topraklarının paylaşılmasını öngören ve İngiltere-Fransa arasında yapılan gizli antlaşma aşağıdakilerden hangisidir?", "opts": ["Sykes-Picot Antlaşması", "Londra Antlaşması", "Boğazlar (İstanbul) Antlaşması", "Mac Mahon Antlaşması"], "a": 0, "exp": "1916 Sykes-Picot Antlaşması, İngiltere ve Fransa arasında yapılmış olup Suriye ve Lübnan'ın Fransa'ya, Musul hariç Irak ve Ürdün'ün İngiltere'ye bırakılmasını öngörmüştür."}, {"cat": "I. Dünya Savaşı ve Osmanlı Cepheleri", "q": "İngiliz Hükümeti'nin Filistin'de bir Yahudi devletinin kurulmasını resmen kabul ettiği belge aşağıdakilerden hangisidir?", "opts": ["Balfour Deklarasyonu", "Sykes-Picot Antlaşması", "Mac Mahon Antlaşması", "Wilson İlkeleri"], "a": 0, "exp": "1917 Balfour Deklarasyonu ile İngiliz Hükümeti, Filistin'de bir Yahudi devleti kurulmasını resmen kabul etmiştir."}, {"cat": "I. Dünya Savaşı ve Osmanlı Cepheleri", "q": "ABD Başkanı Wilson'un 8 Ocak 1918'de yayımladığı ve dünya barışını sağlamayı amaçlayan ilkeler bütünü aşağıdakilerden hangisidir?", "opts": ["Wilson İlkeleri", "Balfour Deklarasyonu", "Sykes-Picot Antlaşması", "Atlantik Bildirisi"], "a": 0, "exp": "Wilson İlkeleri (8 Ocak 1918), dünya barışını sağlamayı amaçlamış; Türklerin yaşadığı yerlerin bağımsızlığının tanınacağını içermiştir."}, {"cat": "I. Dünya Savaşı ve Osmanlı Cepheleri", "q": "Mondros Ateşkes Antlaşması'nı Osmanlı Hükümeti adına kim imzalamıştır?", "opts": ["Rauf Bey (Orbay)", "Ahmet İzzet Paşa", "Tevfik Paşa", "Damat Ferit Paşa"], "a": 0, "exp": "Mondros Ateşkes Antlaşması, Osmanlı Hükümeti adına Bahriye Nazırı Rauf Bey (Orbay) tarafından imzalanmıştır."}, {"cat": "Mondros Sonrası İşgaller ve Cemiyetler", "q": "İzmir'in işgali sonrası bölgedeki karışıklıkları araştırmak amacıyla hazırlanan ve Yunan iddialarının asılsız olduğunu ortaya koyan rapor aşağıdakilerden hangisidir?", "opts": ["Amiral Bristol Raporu", "Harbord Raporu", "Sandler Raporu", "Koçi Bey Raporu"], "a": 0, "exp": "Amiral Bristol Raporu (11 Ekim 1919), İzmir'in işgali sonrası hazırlanmış olup bölgede Rum nüfusun fazla olduğu iddiasının yalan olduğunu ortaya koymuştur."}, {"cat": "Mondros Sonrası İşgaller ve Cemiyetler", "q": "Doğu Anadolu'da bir Ermeni Devleti kurulması fikrinin desteklenmesinden ABD'nin vazgeçmesine neden olan rapor aşağıdakilerden hangisidir?", "opts": ["Harbord Raporu", "Amiral Bristol Raporu", "Sandler Raporu", "Koçi Bey Raporu"], "a": 0, "exp": "General Harbord'un hazırladığı Harbord Raporu, Doğu Anadolu'nun hiçbir bölgesinde Ermeni nüfusunun fazla olmadığını belirtmiş; ABD bu bölgede Ermeni Devleti kurulmasını desteklemekten vazgeçmiştir."}, {"cat": "Mondros Sonrası İşgaller ve Cemiyetler", "q": "Mondros sonrası kurulan cemiyetlerden hangisi 'Zararlı Cemiyetler' arasında yer alır?", "opts": ["Mavri Mira Cemiyeti", "İzmir Müdafaa-i Hukuk Cemiyeti", "Trakya Paşaeli Cemiyeti", "Doğu Anadolu Müdafaa-i Hukuk Cemiyeti"], "a": 0, "exp": "Mavri Mira Cemiyeti, Rumlar tarafından kurulan zararlı bir cemiyettir."}, {"cat": "Mondros Sonrası İşgaller ve Cemiyetler", "q": "Erzurum Kongresi'ni organize ederek Milli Mücadele'nin teşkilatlanmasında önemli rol oynayan yararlı cemiyet aşağıdakilerden hangisidir?", "opts": ["Doğu Anadolu Müdafaa-i Hukuk Cemiyeti", "İzmir Redd-i İlhak Cemiyeti", "Trakya Paşaeli Cemiyeti", "Kilikyalılar Cemiyeti"], "a": 0, "exp": "Doğu Anadolu Müdafaa-i Hukuk Cemiyeti, Erzurum Kongresi'ni organize ederek Milli Mücadele'nin teşkilatlanmasında önemli rol oynamıştır."}, {"cat": "Mondros Sonrası İşgaller ve Cemiyetler", "q": "Kuvayı Milliye kavramını resmi anlamda ilk kullanan kuruluş aşağıdakilerden hangisidir?", "opts": ["Milli Kongre Cemiyeti", "İzmir Müdafaa-i Hukuk Cemiyeti", "Trabzon Muhafaza-i Hukuk-u Milliye Cemiyeti", "Kars İslam Şurası"], "a": 0, "exp": "Milli Kongre Cemiyeti, Dr. Esat Bey'in raporu doğrultusunda yararlı cemiyetleri birleştirmeyi amaçlamış ve Kuvayı Milliye kavramını resmi olarak ilk kullanan kuruluş olmuştur."}, {"cat": "Mondros Sonrası İşgaller ve Cemiyetler", "q": "Kuvayı Milliye birlikleri için aşağıdaki ifadelerden hangisi söylenemez?", "opts": ["Askeri disiplin içinde, tek merkezden yönetilen düzenli birliklerdir", "Gönüllülerden oluşur", "Bölgeseldir", "İhtiyaçlarını halktan karşılamışlardır"], "a": 0, "exp": "Kuvayı Milliye, askeri disiplinden yoksun, tek merkezden yönetilmeyen düzensiz milis (halk) kuvvetleridir."}, {"cat": "Mondros Sonrası İşgaller ve Cemiyetler", "q": "Mütareke döneminde kurulan ve TBMM'nin resmen tanıdığı istihbarat grubunun adı nedir?", "opts": ["Mim Mim Grubu", "Karakol Cemiyeti", "İttihat ve Terakki", "Teşkilat-ı Mahsusa"], "a": 0, "exp": "Mim Mim Grubu (Müsellah Müdafaa-i Milliye), TBMM'nin resmen tanıdığı bir istihbarat grubudur."}, {"cat": "Mondros Sonrası İşgaller ve Cemiyetler", "q": "İşgallere karşı ilk direnişin gerçekleştiği yer aşağıdakilerden hangisidir?", "opts": ["Hatay (Dörtyol)", "Ayvalık", "İzmir", "Antep"], "a": 0, "exp": "İşgallere karşı ilk direniş Hatay'ın Dörtyol ilçesinde k Dönemi (Kongreler)", "q": "Sivas Kongresi'nin toplanması hangi belgede kararlaştırılmıştır?", "opts": ["Amasya Tamimi", "Erzurum Kongresi Beyannamesi", "Havza Genelgesi", "Misak-ı Milli"], "a": 0, "exp": "Sivas Kongresi'nin toplanması yönündeki karar Amasya Tamimi'nde alınmıştır."}, {"cat": "Milli Mücadele Hazırlık Dönemi (Kongreler)", "q": "Sivas Kongresi sonrasında Temsil Kurulu'nun baskısı sonucu istifa etmek zorunda kalan sadrazam kimdir?", "opts": ["Damat Ferit Paşa", "Ali Rıza Paşa", "Tevfik Paşa", "Salih Paşa"], "a": 0, "exp": "Temsil Kurulu, Sivas Kongresi sonrasında İstanbul'la haberleşmeyi kesince Sadrazam Damat Ferit istifa etmek zorunda kalmıştır; bu, Heyet-i Temsiliye'nin ilk siyasi başarısıdır."}, {"cat": "TBMM'nin Açılışı ve Örgütlenme Dönemi", "q": "Son Osmanlı Mebusan Meclisi'nde kabul edilen ve Milli Mücadele'nin temel ilkelerini belirleyen belge aşağıdakilerden hangisidir?", "opts": ["Misak-ı Milli", "Teşkilat-ı Esasiye Kanunu", "Amasya Tamimi", "Sevr Antlaşması"], "a": 0, "exp": "Misak-ı Milli (28 Ocak 1920), Erzurum ve Sivas kongreleri kararları doğrultusunda Mustafa Kemal tarafından hazırlanmış ve son Osmanlı Mebusan Meclisi'nde kabul edilmiştir."}, {"cat": "TBMM'nin Açılışı ve Örgütlenme Dönemi", "q": "Misak-ı Milli'nin kabul edilmesinden sonra İstanbul'un itilaf devletlerince resmen işgal edildiği tarih aşağıdakilerden hangisidir?", "opts": ["16 Mart 1920", "23 Nisan 1920", "10 Ağustos 1920", "30 Ekim 1918"], "a": 0, "exp": "16 Mart 1920'de İstanbul, itilaf devletleri tarafından resmen işgal edilmiş, Mebusan Meclisi basılarak bazı milletvekilleri Malta'ya sürgün edilmiştir."}, {"cat": "TBMM'nin Açılışı ve Örgütlenme Dönemi", "q": "TBMM hangi tarihte açılmıştır?", "opts": ["23 Nisan 1920", "19 Mayıs 1919", "29 Ekim 1923", "20 Ocak 1921"], "a": 0, "exp": "TBMM, 23 Nisan 1920'de açılmıştır."}, {"cat": "TBMM'nin Açılışı ve Örgütlenme Dönemi", "q": "TBMM'nin açılış toplantısına en yaşlı üye olarak kim başkanlık etmiştir?", "opts": ["Sinop Millet
