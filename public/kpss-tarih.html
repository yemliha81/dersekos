arında köylü üzerindeki büyük bir yükü kaldıran vergi düzenlemesi aşağıdakilerden hangisidir?", "opts": ["Aşar Vergisinin kaldırılması (1925)", "Kabotaj Kanunu", "Teşvik-i Sanayi Kanunu", "Toprak Reformu Kanunu"], "a": 0, "exp": "1925 yılında Aşar Vergisi'nin kaldırılmasıyla köylünün ulusal sermayeden daha fazla yararlanması sağlanmıştır."}, {"cat": "Cumhuriyet Dönemi İnkılapları", "q": "Türk tarihinin o döneme kadarki en büyük ekonomik kongresi olan ve Misak-ı İktisadi kararlarının alındığı kongre aşağıdakilerden hangisidir?", "opts": ["İzmir İktisat Kongresi", "Sivas Kongresi", "Erzurum Kongresi", "Balıkesir Kongresi"], "a": 0, "exp": "İzmir İktisat Kongresi (17 Şubat 1923), Kazım Karabekir başkanlığında toplanmış ve Misak-ı İktisadi kararları alınmıştır."}, {"cat": "Cumhuriyet Dönemi İnkılapları", "q": "Sovyet Rusya'nın desteğiyle uygulanan ve KİT'lerin (Kamu İktisadi Teşekkülleri) açılmasını sağlayan sanayi planı aşağıdakilerden hangisidir?", "opts": ["1. Beş Yıllık Sanayi Planı (1934)", "Teşvik-i Sanayi Kanunu", "Toprak Reformu Kanunu", "Kabotaj Kanunu"], "a": 0, "exp": "1. Beş Yıllık Sanayi Planı, 1934'te uygulamaya konmuş, Sovyet Rusya'nın desteğiyle çok sayıda KİT açılmıştır."}, {"cat": "Cumhuriyet Dönemi İnkılapları", "q": "Şapka Kanunu hangi tarihte çıkarılmıştır?", "opts": ["25 Kasım 1925", "30 Kasım 1925", "21 Haziran 1934", "1 Ocak 1926"], "a": 0, "exp": "Şapka Kanunu, 25 Kasım 1925'te çıkarılmıştır."}, {"cat": "Cumhuriyet Dönemi İnkılapları", "q": "Tekke, zaviye ve türbelerin kapatıldığı tarih aşağıdakilerden hangisidir?", "opts": ["30 Kasım 1925", "25 Kasım 1925", "3 Mart 1924", "1926"], "a": 0, "exp": "Tekke, zaviye ve türbeler, 30 Kasım 1925'te kapatılmıştır; bu kanunla şeyhlik, dedelik gibi unvanlar da yasaklanmıştır."}, {"cat": "Cumhuriyet Dönemi İnkılapları", "q": "Miladi Takvim ve modern saat uygulaması hangi tarihten itibaren yürürlüğe girmiştir?", "opts": ["1 Ocak 1926", "1 Ocak 1929", "26 Aralık 1925", "21 Haziran 1934"], "a": 0, "exp": "26 Aralık 1925'te kabul edilen Miladi Takvim ve modern saat, 1 Ocak 1926'dan itibaren uygulanmaya başlamıştır."}, {"cat": "Cumhuriyet Dönemi İnkılapları", "q": "Herkese bir soyadı alma zorunluluğu getiren Soyadı Kanunu hangi tarihte çıkarılmıştır?", "opts": ["21 Haziran 1934", "24 Kasım 1934", "1 Ocak 1935", "29 Kasım 1934"], "a": 0, "exp": "Soyadı Kanunu, 21 Haziran 1934'te çıkarılmıştır."}, {"cat": "Atatürk İlkeleri", "q": "TBMM'nin açılması, saltanatın kaldırılması ve cumhuriyetin ilanı hangi Atatürk ilkesinin bütünleyici uygulamalarıdır?", "opts": ["Cumhuriyetçilik", "Laiklik", "Devletçilik", "Halkçılık"], "a": 0, "exp": "TBMM'nin açılması, saltanatın kaldırılması, cumhuriyetin ilanı gibi gelişmeler Cumhuriyetçilik ilkesinin uygulamalarındandır."}, {"cat": "Atatürk İlkeleri", "q": "Din ve devlet işlerinin birbirinden ayrılması esasına dayanan Atatürk ilkesi aşağıdakilerden hangisidir?", "opts": ["Laiklik", "Milliyetçilik", "Halkçılık", "Devletçilik"], "a": 0, "exp": "Laiklik, din ve devlet işlerinin birbirinden ayrılması esasına dayanır."}, {"cat": "Atatürk İlkeleri", "q": "Sosyal, kültürel ve ekonomik kalkınmanın kaynağının devlet olduğunu savunan ilke aşağıdakilerden hangisidir?", "opts": ["Devletçilik", "Halkçılık", "Cumhuriyetçilik", "Milliyetçilik"], "a": 0, "exp": "Devletçilik ilkesine göre sosyal, kültürel ve ekonomik kalkınmanın kaynağı devlettir; özel sermayenin yetersiz olduğu dönemlerde uygulama alanı bulmuştur."}, {"cat": "Atatürk İlkeleri", "q": "Hiçbir kişi veya zümreye ayrıcalık tanınmaması, sınıf farklılıklarının reddedilmesi hangi ilkenin temelidir?", "opts": ["Halkçılık", "Milliyetçilik", "Laiklik", "İnkılapçılık"], "a": 0, "exp": "Halkçılık, hiçbir kişi veya zümreye ayrıcalık tanınmaması ve eşitlik anlayışı üzerine kuruludur; cumhuriyetçiliğin doğal bir sonucudur."}, {"cat": "Atatürk İlkeleri", "q": "Atatürk devrimlerinin durağanlıktan kurtularak gelişmesini ve ilerlemesini sağlayan ilke aşağıdakilerden hangisidir?", "opts": ["İnkılapçılık", "Milliyetçilik", "Halkçılık", "Devletçilik"], "a": 0, "exp": "İnkılapçılık, Atatürk devrimlerinin durağanlıktan kurtulmasını, gelişmesini ve ilerlemesini sağlayan ilkedir; amacı Türk toplumunu çağdaş medeniyet seviyesine çıkarmaktır."}, {"cat": "Atatürk İlkeleri", "q": "Atatürk'e göre 'kendisini Türk kabul eden herkes Türk'tür' anlayışı hangi ilkeyle ilişkilidir?", "opts": ["Milliyetçilik", "Halkçılık", "Laiklik", "Devletçilik"], "a": 0, "exp": "Milliyetçilik ilkesi, birleştirici ve bütünleştiricidir; ırkçılığı reddeder ve Atatürk'e göre kendisini Türk kabul eden herkes Türktür."}, {"cat": "Atatürk İlkeleri", "q": "Kabotaj Kanunu, Türk Tarih Kurumu ve Türk Dil Kurumu hangi Atatürk ilkesiyle ilişkilidir?", "opts": ["Milliyetçilik", "Halkçılık", "Devletçilik", "Laiklik"], "a": 0, "exp": "Kabotaj Kanunu, Türk Tarih Kurumu, Türk Dil Kurumu gibi uygulamalar Milliyetçilik ilkesinin bütünleyicisi niteliğindedir."}, {"cat": "Atatürk İlkeleri", "q": "6 Atatürk ilkesinin anayasaya eklendiği yıl aşağıdakilerden hangisidir?", "opts": ["1937", "1924", "1928", "1934"], "a": 0, "exp": "1937 yılında 6 Atatürk ilkesi (Cumhuriyetçilik, Milliyetçilik, Halkçılık, Devletçilik, Laiklik, İnkılapçılık) anayasaya eklenmiştir."}, {"cat": "Cumhuriyet Dönemi Dış Politikası", "q": "Türkiye ile Yunanistan arasındaki nüfus mübadelesi sorunu hangi antlaşmayla tamamen giderilmiştir?", "opts": ["1930 Ankara Antlaşması", "1926 Atina Antlaşması", "1923 Lozan Antlaşması", "1936 Montrö Sözleşmesi"], "a": 0, "exp": "Türk-Yunan nüfus mübadelesi sorunu, 1926'da Atina'da imzalanan antlaşmayla kısmen, 1930'da Ankara'da imzalanan antlaşmayla tamamen giderilmiştir."}, {"cat": "Cumhuriyet Dönemi Dış Politikası", "q": "Musul Sorunu, Türkiye ile İngiltere arasında hangi antlaşmayla çözüme kavuşturulmuştur?", "opts": ["1926 Ankara Antlaşması", "Lozan Antlaşması", "Montrö Sözleşmesi", "Balkan Antantı"], "a": 0, "exp": "5 Haziran 1926'da imzalanan Ankara Antlaşması ile Musul, İngiliz mandası altındaki Irak'a bırakılmış ve Türkiye-Irak sınırı çizilmiştir."}, {"cat": "Cumhuriyet Dönemi Dış Politikası", "q": "Musul'dan elde edilen petrol gelirinin yüzde onunun kaç yıl süreyle Türkiye'ye bırakılması kararlaştırılmıştır?", "opts": ["25 yıl", "10 yıl", "50 yıl", "5 yıl"], "a": 0, "exp": "1926 Ankara Antlaşması'na göre Musul petrol gelirinin yüzde onunun 25 yıl süreyle Türkiye'ye bırakılması kararlaştırılmış, ancak Türkiye bu haktan 500.000 Sterlin karşılığında vazgeçmiştir."}, {"cat": "Cumhuriyet Dönemi Dış Politikası", "q": "Türkiye'nin Milletler Cemiyeti'ne üye olduğu tarih aşağıdakilerden hangisidir?", "opts": ["18 Temmuz 1932", "20 Temmuz 1936", "9 Şubat 1934", "9 Temmuz 1937"], "a": 0, "exp": "Türkiye, 18 Temmuz 1932'de Milletler Cemiyeti'ne üye olmuştur."}, {"cat": "Cumhuriyet Dönemi Dış Politikası", "q": "Türkiye, Yunanistan, Yugoslavya ve Romanya'nın 1934'te oluşturduğu bölgesel işbirliği örgütü aşağıdakilerden hangisidir?", "opts": ["Balkan Antantı", "Sadabat Paktı", "Akdeniz Paktı", "Milletler Cemiyeti"], "a": 0, "exp": "Balkan Antantı (9 Şubat 1934), Türkiye, Yunanistan, Yugoslavya ve Romanya arasında bölgesel barışı sağlamak amacıyla kurulmuştur."}, {"cat": "Cumhuriyet Dönemi Dış Politikası", "q": "Boğazlar üzerinde Türkiye'ye tam denetim sağlayan sözleşme aşağıdakilerden hangisidir?", "opts": ["Montrö Boğazlar Sözleşmesi (1936)", "Lozan Antlaşması", "Sevr Antlaşması", "Balkan Antantı"], "a": 0, "exp": "20 Temmuz 1936'da imzalanan Montrö Boğazlar Sözleşmesi ile Türkiye, Boğazlar üzerinde tam denetimi sağlamıştır."}, {"cat": "Cumhuriyet Dönemi Dış Politikası", "q": "Montrö Boğazlar Sözleşmesi'ne göre aşağıdakilerden hangisi doğrudur?", "opts": ["Türkiye, boğazların her iki yakasında asker bulundurabilecektir", "Boğazlar komisyonu güçlendirilmiştir", "Ticaret gemilerinin geçişi yasaklanmıştır", "Boğazlar uluslararası bir yönetime bırakılmıştır"], "a": 0, "exp": "Montrö Boğazlar Sözleşmesi ile boğazlar komisyonu kaldırılmış, Türkiye boğazların her iki yakasında asker bulundurabilir hale gelmiştir."}, {"cat": "Cumhuriyet Dönemi Dış Politikası", "q": "Türkiye, İran, Irak ve Afganistan arasında 1937'de imzalanan ve İtalya'nın Etiyopya'ya saldırması üzerine bölgesel barışı korumayı amaçlayan pakt aşağıdakilerden hangisidir?", "opts": ["Sadabat Paktı", "Balkan Antantı", "Bağdat Paktı", "Montrö Sözleşmesi"], "a": 0, "exp": "Sadabat Paktı (9 Temmuz 1937), Türkiye, İran, Irak ve Afganistan arasında imzalanmıştır; Suriye bu pakta katılmamıştır."}, {"cat": "Cumhuriyet Dönemi Dış Politikası", "q": "Hatay Sorunu hangi yıl Türkiye lehine sonuçlanmıştır?", "opts": ["1939", "1936", "1937", "1938"], "a": 0, "exp": "1939 yılında Hatay Meclisi'nin aldığı kararla Hatay, Türkiye'ye bağlanmıştır."}, {"cat": "Cumhuriyet Dönemi Dış Politikası", "q": "Fransa'nın Hatay'ı Suriye'ye devretme kararına karşı çıkan Türkiye'nin konuyu taşıdığı kurum aşağıdakilerden hangisidir?", "opts": ["Milletler Cemiyeti", "Birleşmiş Milletler", "NATO", "Bağdat Paktı"], "a": 0, "exp": "Fransa'nın Hatay'ı Suriye'ye devretme kararına karşı çıkan Türkiye, İngiltere'nin desteğiyle konuyu Milletler Cemiyeti'ne götürmüştür."}, {"cat": "Cumhuriyet Dönemi Dış Politikası", "q": "Sandler Raporu Hatay ile ilgili hangi görüşü desteklemiştir?", "opts": ["Bölgede Türk kültürünün hakim olduğu ve özel bir yönetim oluşturulabileceği", "Bölgenin tamamen Suriye'ye bırakılması gerektiği", "Bölgenin Fransa'da kalması gerektiği", "Bölgenin bağımsız olması gerektiği"], "a": 0, "exp": "Milletler Cemiyeti çerçevesinde hazırlanan Sandler Raporu'nda bölgede Türkçe konuşulduğu, Türk kültürünün hakim olduğu ve özel bir yönetim oluşturulabileceği belirtilmiştir."}, {"cat": "Cumhuriyet Dönemi Dış Politikası", "q": "Yabancı okullar sorunu ile ilgili Türkiye'nin izlediği politika aşağıdakilerden hangisidir?", "opts": ["Sorunu bir iç mesele olarak görüp tek taraflı çözmek", "Sorunu Milletler Cemiyeti'ne taşımak", "Fransa ile savaşa girmek", "Okulları hiç kapatmamak"], "a": 0, "exp": "Türkiye, azınlık ve yabancı okullar sorununu bir iç mesele olarak algılamış ve dışarıdan müdahaleye izin vermeden tek taraflı çözmüştür."}, {"cat": "I. Dünya Savaşı ve Sonuçları", "q": "I. Dünya Savaşı'nı başlatan olay aşağıdakilerden hangisidir?", "opts": ["Avusturya-Macaristan veliahtı Ferdinand'ın Saraybosna'da öldürülmesi", "Almanya'nın Fransa'ya saldırması", "Osmanlı'nın Rus limanlarını bombalaması", "Rusya'nın savaştan çekilmesi"], "a": 0, "exp": "28 Haziran 1914'te Avusturya-Macaristan veliahtı Ferdinand'ın Sırp bir milliyetçi tarafından Saraybosna'da öldürülmesi, I. Dünya Savaşı'nı başlatan olaydır."}, {"cat": "I. Dünya Savaşı ve Sonuçları", "q": "I. Dünya Savaşı'nda İttifak Devletleri arasında aşağıdakilerden hangisi yer almaz?", "opts": ["Fransa", "Almanya", "Avusturya-Macaristan", "Osmanlı Devleti"], "a": 0, "exp": "Fransa, İtilaf (Anlaşma) Devletleri arasında yer alır; İttifak Devletleri arasında Almanya, Avusturya-Macaristan ve sonradan katılan Osmanlı Devleti bulunur."}, {"cat": "I. Dünya Savaşı ve Sonuçları", "q": "I. Dünya Savaşı sonunda dört imparatorluğun yıkılması bunlardan biri değildir?", "opts": ["Fransa İmparatorluğu", "Çarlık Rusya", "Almanya İmparatorluğu", "Osmanlı İmparatorluğu"], "a": 0, "exp": "I. Dünya Savaşı sonunda Çarlık Rusya, Almanya, Avusturya-Macaristan ve Osmanlı İmparatorluğu yıkılmıştır; Fransa bu dört imparatorluk arasında değildir."}, {"cat": "I. Dünya Savaşı ve Sonuçları", "q": "I. Dünya Savaşı sonrasında düzeni belirlemek için toplanan konferans aşağıdakilerden hangisidir?", "opts": ["Paris Barış Konferansı", "Lozan Konferansı", "Londra Konferansı", "Berlin Konferansı"], "a": 0, "exp": "Paris Barış Konferansı (18 Ocak 1919), I. Dünya Savaşı sonrası düzeni belirlemek amacıyla toplanmıştır."}, {"cat": "I. Dünya Savaşı ve Sonuçları", "q": "Rusya'da Çarlık rejimini yıkan ve Bolşeviklerin yönetimi ele geçirdiği ihtilal aşağıdakilerden hangisidir?", "opts": ["1917 Bolşevik İhtilali", "Fransız İhtilali", "Meiji Restorasyonu", "Kasım Ayaklanması"], "a": 0, "exp": "1917 Bolşevik İhtilali ile Rusya'da Çarlık rejimi yıkılmış ve Bolşevikler (Lenin liderliğinde) yönetimi ele geçirmiştir."}, {"cat": "I. Dünya Savaşı ve Sonuçları", "q": "Sovyet Rusya'nın savaştan çekilmek için imzaladığı antlaşma aşağıdakilerden hangisidir?", "opts": ["Brest-Litowsk Antlaşması", "Versay Antlaşması", "Sevr Antlaşması", "Triyanon Antlaşması"], "a": 0, "exp": "3 Mart 1918'de imzalanan Brest-Litowsk Antlaşması ile Sovyet Rusya savaştan çekilmiştir; bu antlaşmayla Kars, Ardahan ve Batum Osmanlıya geri verilmiştir."}, {"cat": "I. Dünya Savaşı ve Sonuçları", "q": "I. Dünya Savaşı sonunda Almanya ile imzalanan barış antlaşması aşağıdakilerden hangisidir?", "opts": ["Versay (Versailles) Antlaşması", "Sevr Antlaşması", "Nöyyi Antlaşması", "Triyanon Antlaşması"], "a": 0, "exp": "28 Haziran 1919'da imzalanan Versay (Versailles) Antlaşması, Almanya ile İtilaf Devletleri arasında imzalanmıştır."}, {"cat": "I. Dünya Savaşı ve Sonuçları", "q": "1917'de ABD'nin I. Dünya Savaşı'na girmesine neden olan gelişme aşağıdakilerden hangisidir?", "opts": ["Almanya'nın iki sivil ABD gemisini batırması", "Rusya'nın savaştan çekilmesi", "İtalya'nın taraf değiştirmesi", "Osmanlı'nın Mondros'u imzalaması"], "a": 0, "exp": "Almanya'nın iki sivil ABD gemisini batırması üzerine ABD, Nisan 1917'de I. Dünya Savaşı'na girmiştir."}, {"cat": "II. Dünya Savaşı", "q": "II. Dünya Savaşı öncesinde Türkiye'nin İtalya'nın Habeşistan'a saldırması üzerine imzaladığı pakt aşağıdakilerden hangisidir?", "opts": ["Sadabat Paktı", "Balkan Antantı", "Montrö Sözleşmesi", "NATO"], "a": 0, "exp": "İtalya'nın 1935'te Habeşistan'a (Etiyopya) saldırması üzerine bölgesel barışı korumak isteyen Türkiye, İran, Irak ve Afganistan Sadabat Paktı'nı imzalamıştır."}, {"cat": "II. Dünya Savaşı", "q": "II. Dünya Savaşı'nda Almanya'nın Polonya'ya saldırmasıyla savaş fiilen hangi tarihte başlamıştır?", "opts": ["1 Eylül 1939", "1 Eylül 1938", "22 Haziran 1941", "7 Aralık 1941"], "a": 0, "exp": "II. Dünya Savaşı, Almanya'nın 1 Eylül 1939'da Polonya'ya saldırmasıyla fiilen başlamıştır."}, {"cat": "II. Dünya Savaşı", "q": "II. Dünya Savaşı sonrasında dünya barışını korumak amacıyla kurulan uluslararası örgüt aşağıdakilerden hangisidir?", "opts": ["Birleşmiş Milletler", "Milletler Cemiyeti", "NATO", "AGİT"], "a": 0, "exp": "Birleşmiş Milletler, II. Dünya Savaşı sonrasında dünya barışını korumak amacıyla kurulmuştur."}, {"cat": "II. Dünya Savaşı", "q": "II. Dünya Savaşı sonrasında Kuzey Kore'nin Güney Kore'ye saldırmasıyla başlayan ve Türkiye'nin bir tugayla katıldığı savaş aşağıdakilerden hangisidir?", "opts": ["Kore Savaşı", "Vietnam Savaşı", "Kıbrıs Barış Harekatı", "Körfez Savaşı"], "a": 0, "exp": "1950-1953 Kore Savaşı'na Türkiye bir tugayla katılmış; Türkiye'nin sınırları dışına asker gönderdiği ilk ülke Güney Kore olmuştur."}, {"cat": "II. Dünya Savaşı", "q": "Kore Savaşı'nı sona erdiren antlaşma aşağıdakilerden hangisidir?", "opts": ["Panmunjom Antlaşması", "Cenevre Antlaşması", "Paris Antlaşması", "Taşkent Deklarasyonu"], "a": 0, "exp": "Kore Savaşı, 1953'te imzalanan Panmunjom Antlaşması ile sona ermiştir."}, {"cat": "II. Dünya Savaşı", "q": "1948'de İsrail Devleti'nin kurulmasının hukuki temeli aşağıdakilerden hangisidir?", "opts": ["1947 BM kararı ile Filistin topraklarının Araplar ve Yahudiler arasında taksim edilmesi", "1917 Balfour Deklarasyonu", "1916 Sykes-Picot Antlaşması", "Camp David Antlaşması"], "a": 0, "exp": "1947 BM kararı ile Filistin toprakları Araplar ve Yahudiler arasında taksim edilmiş; bu karar Arap-İsrail çatışmalarını şiddetlendirmiştir."}, {"cat": "II. Dünya Savaşı", "q": "1973 Arap-İsrail Savaşı'na ne ad verilir?", "opts": ["Yom Kippur Savaşı", "Altı Gün Savaşı", "Süveyş Savaşı", "Sina Savaşı"], "a": 0, "exp": "1973 Arap-İsrail Savaşı, 'Yom Kippur Savaşı' olarak bilinir; bu savaşta Arap ülkeleri Batılı devletlere petrol ambargosu koymuş ve petrol krizine yol açmıştır."}, {"cat": "II. Dünya Savaşı", "q": "Mısır ile İsrail arasında barışı sağlayan ve Mısır Devlet Başkanı Enver Sedat ile İsrail Başbakanı Menahem Begin arasında imzalanan antlaşma aşağıdakilerden hangisidir?", "opts": ["Camp David Antlaşması", "Panmunjom Antlaşması", "Taşkent Deklarasyonu", "SALT-I Antlaşması"], "a": 0, "exp": "1978 Camp David Antlaşması, Mısır Devlet Başkanı Enver Sedat ile İsrail Başbakanı Menahem Begin arasında imzalanmış ve Mısır-İsrail barışını sağlamıştır."}, {"cat": "II. Dünya Savaşı", "q": "Hindistan'ın bağımsızlık mücadelesinde önderlik eden ve pasif direniş yöntemini benimseyen lider kimdir?", "opts": ["Mahatma Gandi", "Muhammed Ali Cinnah", "Jawaharlal Nehru", "Ho Chi Minh"], "a": 0, "exp": "Mahatma Gandi, Hindistan'ın bağımsızlık mücadelesinde Hindular arasında önderlik yapan liderdir."}, {"cat": "II. Dünya Savaşı", "q": "1947'de Hindistan'dan ayrılarak bağımsızlığını kazanan ve ilk lideri Muhammed Ali Cinnah olan devlet aşağıdakilerden hangisidir?", "opts": ["Pakistan", "Bangladeş", "Seylan", "Afganistan"], "a": 0, "exp": "Pakistan, 14 Mayıs 1947'de kurulmuş, ilk lideri Muhammed Ali Cinnah olmuştur."}, {"cat": "Soğuk Savaş Dönemi ve Türkiye", "q": "Türkiye NATO'ya hangi tarihte üye olmuştur?", "opts": ["18 Şubat 1952", "8 Ağustos 1949", "16 Nisan 1948", "28 Şubat 1953"], "a": 0, "exp": "Türkiye, 18 Şubat 1952'de NATO'ya (Kuzey Atlantik Paktı'na) katılmıştır."}, {"cat": "Soğuk Savaş Dönemi ve Türkiye", "q": "Türkiye'nin NATO'ya üyeliğine tepki gösteren devletler aşağıdakilerden hangisidir?", "opts": ["Sovyet Rusya ve Bulgaristan", "İngiltere ve Fransa", "ABD ve Kanada", "İtalya ve Yunanistan"], "a": 0, "exp": "Türkiye'nin NATO'ya üyeliği, Sovyet Rusya ve Bulgaristan tarafından tepkiyle karşılanmıştır."}, {"cat": "Soğuk Savaş Dönemi ve Türkiye", "q": "Türkiye, Yunanistan ve Yugoslavya arasında 1953'te kurulan pakt aşağıdakilerden hangisidir?", "opts": ["Balkan Paktı", "Bağdat Paktı", "Sadabat Paktı", "Varşova Paktı"], "a": 0, "exp": "28 Şubat 1953'te Türkiye, Yunanistan ve Yugoslavya arasında Balkan Paktı kurulmuştur."}, {"cat": "Soğuk Savaş Dönemi ve Türkiye", "q": "1955 yılında Türkiye ve Irak arasında temeli atılan ve sonradan CENTO adını alan pakt aşağıdakilerden hangisidir?", "opts": ["Bağdat Paktı", "Balkan Paktı", "Sadabat Paktı", "SEATO"], "a": 0, "exp": "Bağdat Paktı, 1955'te Türkiye-Irak arasında temeli atılmış, sonradan İngiltere, İran ve Pakistan'ın katılımıyla genişlemiş, 1959'da CENTO adını almıştır."}, {"cat": "Soğuk Savaş Dönemi ve Türkiye", "q": "Türkiye'de çok partili hayata geçişin ilk muhalefet partisi aşağıdakilerden hangisidir?", "opts": ["Milli Kalkınma Partisi", "Demokrat Parti", "Serbest Cumhuriyet Fırkası", "Terakkiperver Cumhuriyet Fırkası"], "a": 0, "exp": "Temmuz 1945'te Nuri Demirağ tarafından kurulan Milli Kalkınma Partisi, çok partili hayata geçişin ilk muhalefet partisidir."}, {"cat": "Soğuk Savaş Dönemi ve Türkiye", "q": "Demokrat Parti'yi kuran isimler arasında aşağıdakilerden hangisi yoktur?", "opts": ["İsmet İnönü", "Celal Bayar", "Adnan Menderes", "Refik Koraltan"], "a": 0, "exp": "Demokrat Parti, 7 Ocak 1946'da Celal Bayar, Adnan Menderes, Refik Koraltan ve Fuat Köprülü tarafından kurulmuştur; İsmet İnönü bu partinin kurucuları arasında değildir."}, {"cat": "Soğuk Savaş Dönemi ve Türkiye", "q": "1950 seçimlerini kazanarak CHP'nin 23 yıllık iktidarına son veren parti aşağıdakilerden hangisidir?", "opts": ["Demokrat Parti", "Milli Kalkınma Partisi", "Serbest Cumhuriyet Fırkası", "Millet Partisi"], "a": 0, "exp": "14 Mayıs 1950 seçimlerini kazanan Demokrat Parti, CHP'nin 23 yıllık iktidarına son vermiştir."}, {"cat": "Soğuk Savaş Dönemi ve Türkiye", "q": "1962 Küba Buhranı'nın nedeni aşağıdakilerden hangisidir?", "opts": ["SSCB'nin Küba'ya füze yerleştirmesi", "ABD'nin Küba'yı işgal etmesi", "Küba'nın NATO'ya girmesi", "Castro'nun ABD ile ittifak kurması"], "a": 0, "exp": "Fidel Castro yönetimindeki Küba'nın SSCB ile yakınlaşması sonucu SSCB'nin Küba'ya füze yerleştirmesi, 1962 Küba Buhranı'na (Füze Krizi) neden olmuştur."}, {"cat": "Soğuk Savaş Dönemi ve Türkiye", "q": "Küba Buhranı'nın çözümünde SSCB'nin Türkiye'deki hangi füzelerin sökülmesini talep ettiği bilinmektedir?", "opts": ["Jupiter Füzeleri", "Patriot Füzeleri", "Scud Füzeleri", "Pershing Füzeleri"], "a": 0, "exp": "SSCB, Türkiye'deki ABD'ye ait Jupiter Füzeleri'nin sökülmesi karşılığında Küba'daki füzelerini sökmeyi teklif etmiştir."}, {"cat": "Soğuk Savaş Dönemi ve Türkiye", "q": "ABD ile SSCB arasında stratejik nükleer silahların sınırlandırılması amacıyla yapılan görüşmelere ne ad verilir?", "opts": ["SALT Görüşmeleri", "Helsinki Konferansı", "Yalta Konferansı", "Potsdam Konferansı"], "a": 0, "exp": "SALT (Stratejik Nükleer Silahların Sınırlandırılması) Görüşmeleri, 1969'da başlamış ve yumuşama (detant) döneminin başlangıcı sayılmıştır."}, {"cat": "Küreselleşen Dünya", "q": "SSCB'nin dağılmasının ardından Türk dış politikasının yeniden şekillendirdiği bölgeler arasında aşağıdakilerden hangisi yer almaz?", "opts": ["Güney Amerika", "Kafkasya", "Balkanlar", "Orta Doğu"], "a": 0, "exp": "SSCB'nin dağılmasıyla Türk dış politikası özellikle Kafkasya, Balkanlar ve Orta Doğu'da yeniden şekillenmiştir; Güney Amerika bu bölgeler arasında değildir."}, {"cat": "Küreselleşen Dünya", "q": "1992'de Türkiye'nin girişimiyle kurulan ve merkezi İstanbul'da bulunan ekonomik işbirliği örgütü aşağıdakilerden hangisidir?", "opts": ["Karadeniz Ekonomik İşbirliği Teşkilatı", "Bağdat Paktı", "Balkan Antantı", "D-8"], "a": 0, "exp": "Karadeniz Ekonomik İşbirliği Teşkilatı, 1992'de Türkiye'nin girişimiyle kurulmuş, merkezi İstanbul'dur."}, {"cat": "Küreselleşen Dünya", "q": "1993 yılında TİKA'nın girişimleriyle Türk cumhuriyetlerinin tek bir alfabede birleşmesini amaçlayan konferans aşağıdakilerden hangisidir?", "opts": ["Alfabe İmla Konferansı", "Helsinki Konferansı", "Paris Konferansı", "Reval Görüşmeleri"], "a": 0, "exp": "1993'te TİKA'nın girişimleriyle düzenlenen Alfabe İmla Konferansı, Türk cumhuriyetlerinin tek bir alfabede birleşmesini amaçlamıştır."}, {"cat": "Küreselleşen Dünya", "q": "Türkiye'nin 1990'larda uygulamaya koyduğu ve Suriye ile Irak'ın tepkisine neden olan proje aşağıdakilerden hangisidir?", "opts": ["Güneydoğu Anadolu Projesi (GAP)", "Bağdat Paktı", "Karadeniz Ekonomik İşbirliği", "Sadabat Paktı"], "a": 0, "exp": "Türkiye'nin 1990'lı yıllarda uygulamaya koyduğu Güneydoğu Anadolu Projesi (GAP), su paylaşımı konusunda Suriye ve Irak'ın tepkisine neden olmuştur."}, {"cat": "Küreselleşen Dünya", "q": "1978 yılında Afganistan'ın SSCB ile imzaladığı ve Sovyet işgaline zemin hazırlayan antlaşma aşağıdakilerden hangisidir?", "opts": ["Dostluk, İyi Komşuluk ve İşbirliği Antlaşması", "Cenevre Antlaşması", "Taşkent Deklarasyonu", "Panmunjom Antlaşması"], "a": 0, "exp": "1978'de Afgan yönetimi, SSCB ile Dostluk, İyi Komşuluk ve İşbirliği Antlaşması imzalamış; bu durum Sovyet işgaline zemin hazırlamıştır."}, {"cat": "Küreselleşen Dünya", "q": "1989'da SSCB'nin Afganistan'dan çekilmesinin ardından ülkenin yaklaşık %70'ini ele geçiren ve İslam devleti kuran grup aşağıdakilerden hangisidir?", "opts": ["Taliban", "Kuzey İttifakı", "Mücahitler", "El Kaide"], "a": 0, "exp": "1992'de mücadeleyi kazanan Molla Muhammed Ömer liderliğindeki Taliban, ülkenin yaklaşık %70'ini ele geçirerek İslam devleti kurmuştur."}, {"cat": "Küreselleşen Dünya", "q": "2003 yılında ABD'nin işgal ettiği ve Saddam Hüseyin'in idam edildiği ülke aşağıdakilerden hangisidir?", "opts": ["Irak", "Afganistan", "İran", "Suriye"], "a": 0, "exp": "2003 yılında ABD, Irak'a müdahale etmiş; Saddam Hüseyin yargılanarak 30 Aralık 2006'da idam edilmiştir."}, {"cat": "Küreselleşen Dünya", "q": "Orta Doğu'da devletler arasında sorunlara neden olan ve Suriye'den geçip Türkiye'den denize dökülen nehir aşağıdakilerden hangisidir?", "opts": ["Asi Nehri", "Nil Nehri", "Şeria Nehri", "Fırat Nehri"], "a": 0, "exp": "Asi Nehri, Lübnan'da doğup Suriye'den geçerek Türkiye'den denize dökülmektedir; bu nehir üzerinde Suriye ve Lübnan barajlar inşa etmiştir."}];

let order = QUESTIONS.map((_, i) => i);
let current = 0;
let answers = new Array(QUESTIONS.length).fill(null); // null = unanswered, else chosen index
let locked = false;

const quizArea = document.getElementById('quizArea');

function shuffle(arr){
  for(let i = arr.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startQuiz(shuffled){
  order = shuffled ? shuffle(QUESTIONS.map((_,i)=>i)) : QUESTIONS.map((_,i)=>i);
  current = 0;
  answers = new Array(QUESTIONS.length).fill(null);
  renderQuestion();
}

function letterFor(i){ return ['A','B','C','D'][i]; }

function renderQuestion(){
  locked = false;
  const idx = order[current];
  const q = QUESTIONS[idx];
  const answeredCount = answers.filter(a => a !== null).length;
  const correctCount = answers.reduce((acc, a, i) => {
    if(a !== null && a === QUESTIONS[i].a) return acc + 1;
    return acc;
  }, 0);

  const pct = Math.round((current) / QUESTIONS.length * 100);

  quizArea.innerHTML = `
    <div class="progress-wrap">
      <div class="progress-row">
        <span>Soru ${current+1} / ${QUESTIONS.length}</span>
        <span class="score">Doğru: ${correctCount}</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>

    <div class="card">
      <div class="era-badge">${escapeHtml(q.cat)}</div>
      <div class="qnum">Soru ${current+1}</div>
      <p class="qtext">${escapeHtml(q.q)}</p>
      <div class="options" id="optionsWrap">
        ${q.opts.map((opt,i)=>`
          <button class="opt" data-i="${i}" aria-label="Seçenek ${letterFor(i)}: ${escapeHtml(opt)}">
            <span class="letter">${letterFor(i)}</span>
            <span class="txt">${escapeHtml(opt)}</span>
          </button>
        `).join('')}
      </div>
      <div class="explain" id="explainBox"></div>
      <div class="nav-row">
        <button class="btn btn-ghost" id="prevBtn" ${current===0 ? 'disabled' : ''}>← Önceki</button>
        <button class="btn btn-primary" id="nextBtn" disabled>${current === QUESTIONS.length-1 ? 'Sonuçları Gör' : 'Sonraki →'}</button>
      </div>
    </div>
  `;

  const prevAnswer = answers[idx];
  const optButtons = quizArea.querySelectorAll('.opt');
  const nextBtn = document.getElementById('nextBtn');
  const prevBtn = document.getElementById('prevBtn');
  const explainBox = document.getElementById('explainBox');

  if(prevAnswer !== null){
    lockOptions(optButtons, q, prevAnswer, explainBox);
    nextBtn.disabled = false;
  }

  optButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      if(locked) return;
      const chosen = parseInt(btn.dataset.i, 10);
      answers[idx] = chosen;
      lockOptions(optButtons, q, chosen, explainBox);
      nextBtn.disabled = false;
    });
  });

  nextBtn.addEventListener('click', () => {
    if(current === QUESTIONS.length - 1){
      renderResult();
    } else {
      current++;
      renderQuestion();
      window.scrollTo({top:0, behavior:'smooth'});
    }
  });

  prevBtn.addEventListener('click', () => {
    if(current > 0){
      current--;
      renderQuestion();
      window.scrollTo({top:0, behavior:'smooth'});
    }
  });
}

function lockOptions(optButtons, q, chosen, explainBox){
  locked = true;
  optButtons.forEach(btn => {
    const i = parseInt(btn.dataset.i, 10);
    btn.classList.add('locked');
    if(i === q.a){
      btn.classList.add('correct');
    } else if(i === chosen){
      btn.classList.add('wrong');
    } else {
      btn.classList.add('dim');
    }
  });
  explainBox.innerHTML = `<b>${chosen === q.a ? 'Doğru! ' : 'Yanlış. '}</b>${escapeHtml(q.exp)}`;
  explainBox.classList.add('show');
}

function renderResult(){
  const total = QUESTIONS.length;
  const correct = answers.reduce((acc,a,i)=> a !== null && a === QUESTIONS[i].a ? acc+1 : acc, 0);
  const answered = answers.filter(a=>a!==null).length;
  const pct = Math.round((correct/total)*100);

  let verdict;
  if(pct >= 90) verdict = "Mükemmel! Tarih bilginiz zirvede.";
  else if(pct >= 75) verdict = "Çok iyi! KPSS'ye hazırsınız gibi görünüyor.";
  else if(pct >= 50) verdict = "Fena değil, ama tekrar biraz daha güç katar.";
  else verdict = "Konuları tekrar gözden geçirmekte fayda var.";

  // category breakdown
  const catStats = {};
  QUESTIONS.forEach((q,i)=>{
    if(!catStats[q.cat]) catStats[q.cat] = {correct:0, total:0};
    catStats[q.cat].total++;
    if(answers[i] === q.a) catStats[q.cat].correct++;
  });

  const catRows = Object.entries(catStats).map(([cat, s]) => {
    const p = Math.round((s.correct/s.total)*100);
    return `
      <div class="breakdown-row">
        <span class="cat-name">${escapeHtml(cat)}</span>
        <div class="mini-bar"><div class="mini-fill" style="width:${p}%"></div></div>
        <span class="cat-score">${s.correct}/${s.total}</span>
      </div>
    `;
  }).join('');

  quizArea.innerHTML = `
    <div class="card result">
      <div class="era-badge">Sınav Tamamlandı</div>
      <div class="big-score">${correct}<span>/${total}</span></div>
      <div class="verdict">${verdict} (Cevaplanan: ${answered}/${total})</div>
      <div class="breakdown">${catRows}</div>
      <div class="result-actions">
        <button class="btn btn-primary" id="restartBtn">Testi Baştan Başlat</button>
        <button class="btn btn-ghost" id="reviewBtn">Cevapları Gözden Geçir</button>
      </div>
    </div>
  `;

  document.getElementById('restartBtn').addEventListener('click', () => {
    startQuiz(false);
    window.scrollTo({top:0, behavior:'smooth'});
  });
  document.getElementById('reviewBtn').addEventListener('click', () => {
    current = 0;
    renderQuestion();
    window.scrollTo({top:0, behavior:'smooth'});
  });
}

function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

startQuiz(false);
</script>
